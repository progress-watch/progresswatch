spec:
  name: progresswatch
  services:
    - name: progresswatch
      github:
        repo: progress-watch/progresswatch
        branch: master
      dockerfile_path: Dockerfile
      http_port: 3000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      health_check:
        http_path: /up
      envs:
        - key: SECRET_KEY_BASE
          scope: RUN_TIME
          type: SECRET
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${progresswatch-db.DATABASE_URL}
        - key: FORCE_SSL
          scope: RUN_TIME
          value: "true"
  databases:
    - name: progresswatch-db
      engine: PG
      version: "18"
      production: false
