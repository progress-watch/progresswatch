spec:
  name: progresswatch
  services:
    - name: progresswatch
      github:
        repo: progress-watch/progresswatch
        branch: master
      dockerfile_path: Dockerfile
      http_port: 3000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      health_check:
        http_path: /up
      envs:
        - key: SECRET_KEY_BASE
          type: SECRET
        - key: DATABASE_URL
          value: ${db.DATABASE_URL}
        - key: REDIS_URL
          value: redis://${redis.PRIVATE_DOMAIN}:${redis.PRIVATE_PORT}
        - key: FORCE_SSL
          value: "true"
    - name: redis
      image:
        registry_type: DOCKER_HUB
        registry: docker.io
        repository: library/redis
        tag: 8-alpine
      internal_ports:
        - 6379
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
  databases:
    - name: db
      engine: PG
      production: false
