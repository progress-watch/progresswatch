name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Neither leg of this matrix is optional: a change that works on only one adapter
  # is a bug regardless of which one it is.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: sqlite3
            database_url: sqlite3:storage/test.sqlite3
          - adapter: postgresql
            database_url: postgresql://postgres:postgres@localhost:5432/progresswatch_test

    services:
      redis:
        image: redis:8-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: progresswatch_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: ${{ matrix.database_url }}
      PROGRESS_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Migrate from scratch
        run: bin/rails db:prepare

      - name: Specs
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t progresswatch:ci .
