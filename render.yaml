services:
  - type: web
    name: progresswatch
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: progresswatch-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: FORCE_SSL
        value: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: progresswatch-db
    plan: 0.1c-256mb
    diskSizeGB: 1
