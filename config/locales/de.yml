  report_as_it_moves_this_is_the_call_that_goes_in_your_loop: "Berichten Sie, während es vorangeht. Das ist der Aufruf, der in Ihre Schleife gehört, und der einzige, der die Zahlen kennt."
  close_it_this_is_what_sends_the_notification: "Schließen Sie sie. Das ist es, was die Benachrichtigung sendet, rufen Sie es also auch bei einem Fehlschlag auf."
  or_wrap_a_process_that_is_not_yours_to_change: "Oder umschließen Sie einen Prozess, den Sie nicht ändern können. Er berichtet Start und Ende statt Zahlen und endet mit dem Status des Befehls."
  in_ci_there_is_no_config_file_to_write: "In CI gibt es keine Konfigurationsdatei zum Schreiben, geben Sie es also über die Umgebung mit."
  agent_skill: "Agent-Skill"
  give_an_ai_agent_a_progress_skill: "Einem KI-Agenten einen Fortschritts-Skill geben"
  give_an_ai_agent_a_skill_for_reporting_its_own_progress: "Geben Sie einem KI-Agenten einen Skill, um seinen eigenen Fortschritt an Progress Watch zu berichten."
  the_skill_drives_the_cli_so_the_agent_needs_no_server_or_uuid_of_its_own: "Der Skill steuert die CLI, der Agent braucht also weder eigenen Server noch eigene UUID — er benutzt das, wofür diese Maschine bereits konfiguriert ist."
  install_the_cli_the_skill_is_a_set_of_instructions_for_driving_it: "Installieren Sie die CLI. Der Skill ist eine Anleitung, um sie zu bedienen."
  point_it_at_this_server_saved_to_progresswatchrc: "Richten Sie sie auf diesen Server. Wird in ~/.progresswatchrc gespeichert, also einmalig."
  create_a_space_for_the_agent_to_report_into: "Legen Sie einen Bereich an, in den der Agent berichten kann."
  point_it_at_this_space_use_local_to_bind_it_to_one_project: "Richten Sie sie auf diesen Bereich. Mit --local binden Sie ihn stattdessen an ein einzelnes Projekt."
  install_the_skill_it_knows_75_agents: "Installieren Sie den Skill. Er kennt über 75 Agenten und fragt, für welchen installiert werden soll."
  that_is_all_the_agent_decides_on_its_own_when_work_is_worth_tracking: "Das ist alles — der Agent entscheidet selbst, wann Arbeit es wert ist, verfolgt zu werden, legt eine Aufgabe für den Job und eine Unteraufgabe je Schritt an und schließt jede, sobald sie fertig ist. Wenn Sie lieber nicht den Installer von jemand anderem ausführen möchten: dieselbe Datei ist skills/progresswatch-cli/SKILL.md in jenem Repository, und sie gehört nach .claude/skills/."
  mcp: "MCP"
  connect_an_agent_over_mcp: "Einen Agenten über MCP verbinden"
  connect_an_ai_agent_to_progress_watch_over_mcp: "Einen KI-Agenten über MCP mit Progress Watch verbinden."
  add_the_server: "Fügen Sie den Server hinzu."
  or_write_it_into_mcp_json_yourself: "Oder schreiben Sie es selbst in .mcp.json."
  the_space_uuid_sits_in_the_url_so_any_client_that_takes_only_a_url_works: "Die Bereichs-UUID steht in der URL, es funktioniert also jeder Client, der nur eine URL annimmt. Um sie aus dem Pfad herauszuhalten, senden Sie sie stattdessen als Header."
  four_tools_create_space_create_task_update_task_complete_task: "Vier Werkzeuge: create_space, create_task, update_task, complete_task. Der Agent entscheidet selbst, wann er eine Aufgabe anlegt und wie oft er berichtet. Einer, der ohne Bereich verbunden ist, kann create_space aufrufen und Ihnen die URL zurückgeben, er steht also nie ohne Ziel da."
  curl: "curl"
  try_the_api_with_curl: "Die API mit curl ausprobieren"
  try_the_api_with_curl_and_report_from_a_client_that_can_only_fire_a_url: "Probieren Sie die Progress-Watch-API mit curl aus und berichten Sie von einem Client, der nur eine URL abfeuern kann."
  create_a_space_keep_its_uuid_whoever_has_it_can_read_and_write_here: "Legen Sie einen Bereich an, behalten Sie seine UUID. Wer sie hat, kann hier lesen und schreiben."
  create_a_task_keep_its_uuid: "Legen Sie eine Aufgabe an, behalten Sie ihre UUID."
  report_progress_every_write_replaces_the_whole_state: "Berichten Sie Fortschritt. Jeder Schreibvorgang ersetzt den gesamten Zustand — senden Sie jedes Mal alles."
  finish_it_this_is_what_sends_the_notification: "Beenden Sie sie. Das ist es, was die Benachrichtigung sendet."
  that_is_the_whole_surface_and_it_is_what_the_cli_and_the_mcp_tools_call: "Das ist die gesamte Oberfläche, und genau das rufen die CLI und die MCP-Werkzeuge auf. Für etwas, das Sie täglich benutzen, ist die CLI eine Zeile statt vier; um darauf aufzubauen, liegen die API-Referenz und OpenAPI 3.1 unter /openapi.json."
  one_more_for_a_client_that_cannot_do_the_above: "Noch eines, für einen Client, der das oben Genannte nicht kann. Manche Dinge kann man nur eine URL übergeben — ein Uptime-Pinger, ein Webhook-Feld in fremder Software, ein Router oder ein Sensor, eine Cron-Zeile mit einem nackten curl. Sie können weder eine Methode wählen noch einen Body senden, also ist derselbe Schreibvorgang auch als einfaches GET erreichbar."
  the_g_is_for_curl_not_for_us: "Das -g ist für curl, nicht für uns: curl liest eckige Klammern in einer URL als Bereich und verweigert die Adresse ohne dieses Flag. Alles, was eine URL einfach abfeuert, braucht nichts Besonderes."
  use_it_only_when_there_is_no_alternative_it_is_a_get_that_writes: "Benutzen Sie es nur, wenn es keine Alternative gibt. Es ist ein GET, das schreibt, also führt alles, was der URL folgt, den Schreibvorgang aus: Fügen Sie sie in einen Chat ein, und die Linkvorschau berichtet für Sie. Wenn Ihr Client überhaupt einen Request-Body senden kann, ist das PUT oben das Richtige."
  docker: "Docker"
  self_host_progress_watch_with_docker: "Progress Watch mit Docker selbst betreiben"
  the_docker_compose_file_for_running_your_own_server: "Die Docker-Compose-Datei, um Ihren eigenen Progress-Watch-Server zu betreiben."
  your_own_server_on_your_own_box: "Ihr eigener Server, auf Ihrer eigenen Maschine. Nichts hiervon spricht mit progress.watch."
  save_this_as_docker_compose_yml_it_runs_the_published_image: "Speichern Sie dies als docker-compose.yml. Sie startet das veröffentlichte Image, es gibt also nichts zu klonen und nichts zu bauen — und ab hier gehört sie Ihnen."
  generate_a_secret_and_paste_it_over_the_placeholder: "Erzeugen Sie ein Secret und setzen Sie es über den Platzhalter, in beiden Diensten."
  start_it_the_app_a_worker_for_notifications_a_redis_and_a_sqlite_file: "Starten Sie es. Die App, ein Worker für Benachrichtigungen, ein Redis und eine SQLite-Datei auf einem Volume."
  then_point_the_cli_at_it_this_page_is_served_from_server: "Richten Sie dann die CLI darauf. Diese Seite wird von {{server}} ausgeliefert."
  that_is_a_working_server_notifications_postgres_and_the_one_click_deploy: "Das ist ein funktionierender Server. Benachrichtigungen, Postgres, das eine, was auf einen Cron gehört, und das Ein-Klick-Deployment stehen alle unter Selbst hosten in der Seitenleiste."
  an_introduction_to_progress_watch_an_open_source_progress_tracker: "Eine Einführung in Progress Watch, einen quelloffenen Fortschritts-Tracker für alles, was ohne Sie läuft."
  watch_any_process: "Jeden Prozess beobachten"
  some_things_run_for_hours_with_nobody_watching: "Manches läuft stundenlang, ohne dass jemand hinsieht: ein nächtlicher Crawl, ein Trainingslauf, eine Migration, eine CI-Pipeline, ein Agent, der sich durch eine lange Aufgabe arbeitet. Progress Watch gibt ihnen einen Ort, an den sie berichten, und Ihnen einen Ort, an dem Sie nachsehen — plus eine Benachrichtigung, wenn sie fertig sind."
  three_commands_from_inside_the_work: "Drei Befehle, aus der Arbeit heraus"
  create_a_task_where_the_job_starts_report_against_it_as_it_moves: "Legen Sie dort eine Aufgabe an, wo der Job beginnt, berichten Sie dagegen, während es vorangeht, und schließen Sie sie, wenn es getan ist. Der mittlere ist der Aufruf, der in Ihre Schleife gehört, und das Einzige, was die Zahlen kennt."
  counts_not_percentages_the_screen_shows_html: "Zahlen statt Prozente: Der Bildschirm zeigt %{counts}, was Ihnen etwas sagt, das %{percent} nicht sagt. Die Gesamtzahl darf sich ändern, wenn ein Job mehr Arbeit entdeckt — senden Sie die neue Zahl, und der Balken rechnet neu. Die Seite %{cli} hat alle drei, fertig zum Einfügen."
  when_the_process_is_not_yours_to_change_html: "Wenn der Prozess nicht Ihrer ist, umschließt %{run} ihn ganz — es legt die Aufgabe an, reicht die Ausgabe unverändert durch und schließt sie mit dem Exit-Code, sodass ein fehlgeschlagener Job Sie trotzdem benachrichtigt. Er berichtet Start und Ende statt Zahlen, denn nichts außerhalb eines Prozesses weiß, wie weit er ist."
  or_one_request_from_anything: "Oder eine Anfrage, von irgendetwas"
  underneath_all_of_it_is_a_single_http_request_html: "Unter alldem liegt eine einzige HTTP-Anfrage, und das ist die ganze API. Es gibt kein SDK zu installieren und nichts zu importieren, denn ein einzelnes %{put} zu umhüllen würde nichts hinzufügen, was Sie nicht selbst schneller schreiben als dessen Dokumentation zu lesen."
  api_reference: "API-Referenz"
  the_api_reference_is_the_reference_to_build_against_html: "Die %{api} ist die Referenz, gegen die Sie bauen, und die %{curl}-Beispiele einzufügen ist der schnellste Weg, die Sache arbeiten zu sehen, bevor Sie sich festlegen."
  agents_report_their_own_work: "Agenten berichten ihre eigene Arbeit"
  agent_skill_lowercase: "Agent-Skill"
  an_ai_agent_breaks_a_job_into_steps_html: "Ein KI-Agent zerlegt einen Job in Schritte und arbeitet dann lange, ohne dass etwas zu sehen wäre. Verbinden Sie einen über %{mcp}, und er bekommt Werkzeuge, um eine Aufgabe anzulegen und dagegen zu berichten: eine Aufgabe für den Job, eine Unteraufgabe je Schritt, laufend aktualisiert. MCP braucht nirgends eine Installation; für einen Client, der es nicht spricht, bringt ein %{skill} dasselbe über die CLI bei."
  the_agent_decides_when_tracking_is_worth_it_and_how_often_to_report: "Der Agent entscheidet, wann sich Verfolgen lohnt und wie oft er berichtet. Die Werkzeugbeschreibungen sagen ihm, wofür eine Aufgabe da ist, nicht welchem Zeitplan er folgen soll."
  no_accounts: "Keine Konten"
  a_space_is_a_container_for_tasks_and_its_uuid_is_the_credential: "Ein Bereich ist ein Behälter für Aufgaben, und seine UUID ist der Zugangsschlüssel. Wer den Link hat, kann lesen und schreiben; teilen heißt, jemandem den Link zu geben. Es gibt nichts, wofür man sich anmeldet, nichts, in das man sich einloggt, und kein Passwort, das verloren gehen kann — was auch bedeutet, dass der Link der einzige Weg zurück zu einem Bereich ist, man ihn also wie ein API-Token aufbewahren sollte."
  progress_is_not_stored: "Fortschritt wird nicht gespeichert"
  current_state_lives_in_memory_and_expires_on_its_own: "Der aktuelle Zustand liegt im Arbeitsspeicher und verfällt von selbst. Ein Crawler, der drei Monate lang jede Sekunde berichtet, lässt keine Datenbank wachsen, und es gibt hinterher nichts aufzuräumen. Der Handel ist bewusst: Es gibt keine Historie und keine Diagramme, nur das, was gerade passiert."
  what_it_will_not_do: "Was es nicht tun wird"
  send_commands_back: "Befehle zurücksenden."
  it_is_a_departures_board_not_an_orchestrator: "Es ist eine Abfahrtstafel, kein Orchestrator. Ein Prozess berichtet; nichts berichtet an ihn."
  keep_a_log: "Ein Log führen."
  one_line_the_latest_per_task: "Eine Zeile, die letzte, je Aufgabe. Log-Speicherung ist ein gelöstes Problem, und das hier ist nicht die Lösung."
  nest_more_than_one_level: "Tiefer als eine Ebene verschachteln."
  a_task_may_have_steps_a_step_may_not: "Eine Aufgabe darf Schritte haben; ein Schritt nicht."
  run_it_yourself: "Selbst betreiben"
  the_docker_snippet: "den Docker-Ausschnitt"
  self_hosting_lowercase: "Selbst hosten"
  the_server_is_open_source_and_self_hosting_is_one_container_html: "Der Server ist quelloffen, und selbst betreiben heißt ein Container plus ein Redis — siehe %{docker}, um ihn zu starten, und %{self_hosting}, um ihn ordentlich zu betreiben. Den gehosteten Dienst gibt es, damit Sie es nicht müssen, nicht weil die Software ohne ihn verkrüppelt wäre."
  nothing_to_sign_up_for: "Nichts, wofür man sich anmeldet"
  make_a_space_keep_its_link_and_start_reporting_into_it: "Legen Sie einen Bereich an, bewahren Sie seinen Link auf, und berichten Sie aus allem hinein."
  create_a_space: "Bereich anlegen"
  watch_any_script_crawler_ci_job_or_agent: "Beobachten Sie jedes Skript, jeden Crawler, jeden CI-Job und jeden Agenten. Er berichtet Fortschritt mit einer einzigen HTTP-Anfrage; Sie sehen von überall zu und bekommen eine Push-Benachrichtigung, wenn er fertig ist. Quelloffen, selbst betreibbar."
  the_server_is_open_source_under_the_agpl: "Der Server ist quelloffen unter der AGPL, und der gehostete Dienst läuft mit demselben Image, das auch Sie nehmen würden. Selbst betreiben kostet einen Container und ein Redis, und die Datenbank bleibt für immer klein, weil Fortschritt nie in sie geschrieben wird."
  one_file: "Eine Datei"
  the_docker_page: "der Docker-Seite"
  docker_compose_yml_is_the_whole_install_html: "%{file} ist die ganze Installation. Sie startet das veröffentlichte Image, es gibt also nichts zu klonen und nichts zu bauen — kopieren Sie sie von %{docker}, die die aktuelle Datei ausgibt, ersetzen Sie den Platzhalter für das Secret und starten Sie:"
  that_is_the_whole_setup_the_app_on_localhost_html: "Das ist die gesamte Einrichtung: die App auf %{url}, ein Worker, ein Redis und eine SQLite-Datei auf einem benannten Volume. Öffnen Sie sie, legen Sie einen Bereich an, und das Verbinden-Menü dieses Bereichs gibt Ihnen Befehle mit bereits eingesetzter UUID."
  configuring_it: "Konfigurieren"
  both_services: "beider"
  both: "beide"
  the_file_is_yours_from_the_moment_you_save_it_html: "Die Datei gehört Ihnen ab dem Moment, in dem Sie sie speichern, und sie ist der einzige Ort, an dem irgendetwas konfiguriert wird — jede Einstellung ist eine Zeile in einem %{environment}-Block, eine hinzuzufügen heißt also, eine Zeile hinzuzufügen:"
  two_services_run_the_same_image_and_both_boot_the_whole_application_html: "Zwei Dienste starten dasselbe Image und booten beide die ganze Anwendung, alles was Sie hinzufügen gehört also in %{both}. Der Fall, der zubeißt, ist ein VAPID-Paar, das auf der App gesetzt und auf dem Worker vergessen wird: Der Knopf erscheint, jemand drückt ihn, und nie wird etwas zugestellt."
  environment_variables_is_the_full_list_html: "%{link} ist die vollständige Liste, und alles darauf funktioniert hier. Um auf einem anderen Port als 7979 zu veröffentlichen, ändern Sie die linke Seite von %{ports} — die App im Container läuft immer auf 3000."
  what_is_running: "Was da läuft"
  three_processes_and_a_file_the_app_answers_requests: "Drei Prozesse und eine Datei. Die App beantwortet Anfragen; Redis hält den aktuellen Fortschritt jeder Aufgabe und die Job-Warteschlange; SQLite hält die Bereiche und die Form jeder Aufgabe. Der Worker existiert für genau eine Aufgabe — eine Benachrichtigung zu senden, wenn etwas fertig wird — eine Installation ohne ihn funktioniert also in jeder anderen Hinsicht und benachrichtigt stillschweigend nie jemanden."
  why_7979: "Warum 7979"
  not_3000_this_is_a_service_you_leave_running_for_weeks_html: "Nicht 3000. Das ist ein Dienst, den Sie wochenlang laufen lassen, während Sie arbeiten, und 3000 ist der Ort, an dem Ihre eigenen Dev-Server landen — Rails, Vite, Next, Grafana und die Hälfte der %{run}-Zeilen in anderen Anleitungen. Ein Hintergrunddienst sollte nicht den umkämpftesten Port der Maschine belegen, am allerwenigsten einer, dessen URL Sie in ein CI-Secret einsetzen und dann vergessen."
  inside_the_container_it_is_still_3000_html: "Im Container ist es weiterhin 3000; nur der veröffentlichte Port ist umgezogen, und das ist die Zeile %{ports}."
  losing_the_volume_is_recoverable: "Das Volume zu verlieren ist verkraftbar"
  spaces_and_task_structure_are_on_it_and_nothing_else: "Bereiche und Aufgabenstruktur liegen darauf, sonst nichts. Geht es verloren, legen Sie einen neuen Bereich an, und Ihre berichtenden Prozesse füllen bei der nächsten Anfrage alles wieder auf. Sichern Sie es, wenn Sie nicht eine neue Bereichs-UUID an alles verteilen möchten, was hineinberichtet — aber es liegt nichts darauf, was sich nicht durch erneutes Laufenlassen der Jobs wiederherstellen ließe."
  sqlite_or_postgresql: "SQLite oder PostgreSQL"
  both_from_the_same_image_and_the_same_migrations_html: "Beides, aus demselben Image und denselben Migrationen, gewählt über %{database_url}. SQLite ist die Voreinstellung und die richtige Antwort für eine Maschine: zwei Tabellen, Zugriffe über den Primärschlüssel, fast nie geschrieben. Zeigen Sie auf %{postgres}, wenn Sie mehrere App-Container betreiben, denn die können sich keine Datei teilen."
  behind_a_proxy: "Hinter einem Proxy"
  set_force_ssl_true_once_something_in_front_terminates_tls_html: "Setzen Sie %{force_ssl}, sobald etwas vor der App TLS terminiert. Es ist standardmäßig aus, damit eine über einfaches HTTP erreichte Installation Sie nicht auf ein Zertifikat umleitet, das Sie nicht haben."
  notifications_lowercase: "Benachrichtigungen"
  set_a_vapid_key_pair_and_a_notify_me_button_appears_html: "Setzen Sie ein VAPID-Schlüsselpaar, und auf jedem Bereich erscheint ein „%{notify}“-Knopf; lassen Sie die Schlüssel ungesetzt, und die Funktion existiert nicht. Es gibt nichts bei Apple oder Google zu registrieren. Siehe %{link} für die ganze Geschichte, einschließlich dessen, was auf einem Telefon passieren muss."
  sweeping_empty_spaces: "Leere Bereiche aufräumen"
  ever: "jemals"
  opening_the_site_creates_a_space_for_you_html: "Die Seite zu öffnen legt einen Bereich für Sie an, es entstehen also viele, die nie benutzt werden — auch durch alles, was die Seite crawlt. Ein Bereich, der %{ever} eine Aufgabe enthalten hat, bleibt für immer erhalten, so lange niemand hinsieht. Nur solche, die nie eine einzige Aufgabe enthielten, werden aufgeräumt, und erst wenn sie älter als 30 Tage sind."
  nothing_runs_it_for_you_schedule_it_however_you_already_schedule_things: "Nichts führt das für Sie aus. Planen Sie es so ein, wie Sie ohnehin Dinge einplanen:"
  crontab_daily_at_0417: "crontab, täglich um 04:17"
  because_nothing_is_on_a_timer_30_days_is_a_floor: "Weil nichts auf einem Timer läuft, sind 30 Tage eine Untergrenze und kein Zeitplan: Führen Sie es täglich aus, verschwinden leere Bereiche an dem Tag, an dem sie infrage kommen; einmal im Jahr, dann bleiben sie bis dahin. Es auszulassen ist für Ihre Daten ungefährlich — der Sweep nimmt nur Zeilen, die nie benutzt wurden — es bedeutet lediglich, dass die Tabelle mit Bereichen wächst, die nie jemand geöffnet hat."
  your_instance_is_not_indexable: "Ihre Instanz ist nicht indexierbar"
  every_page_of_a_self_hosted_install_is_noindex_html: "Jede Seite einer selbst betriebenen Installation ist %{noindex}, %{robots} verbietet alles, und %{sitemap} antwortet mit 404. Von der eigenen Maschine aus gibt es kein Publikum zu erreichen und nichts dort, was in einer Suche gefunden werden möchte, und dafür muss nichts konfiguriert werden — so bekommen Sie es."
  the_point_of_the_whole_product_is_the_moment_a_job_finishes: "Der Sinn des ganzen Produkts ist der Moment, in dem ein Job fertig wird, während Sie woanders sind. Progress Watch liefert das über Web Push, direkt vom Server an Ihren Browser — Desktop und Telefon über einen Mechanismus, und nichts dazwischen gehört uns."
  turning_it_on: "Einschalten"
  push_is_opt_in_per_space_open_a_space_press_html: "Push ist pro Bereich opt-in. Öffnen Sie einen Bereich, drücken Sie %{notify}, und dieser Browser ist für diesen Bereich registriert und für keinen anderen. Bis Sie drücken, wird nichts über Sie gespeichert, und den Bereich zu entfernen meldet ihn wieder ab."
  on_a_phone_install_the_site_first: "Auf dem Telefon zuerst die Seite installieren"
  add_to_home_screen: "Zum Home-Bildschirm"
  ios_delivers_web_push_only_to_a_site_added_to_the_home_screen_html: "iOS liefert Web Push nur an eine Seite, die zum Home-Bildschirm hinzugefügt wurde, und daran führt kein Weg vorbei: Öffnen Sie den Bereich in Safari, Teilen, %{add}, und drücken Sie Benachrichtigen von dort. Android und Desktop funktionieren aus einem gewöhnlichen Tab."
  installing_has_a_second_benefit_on_ios: "Das Installieren hat auf iOS einen zweiten Vorteil. Safari löscht den lokalen Speicher einer gewöhnlichen Seite nach sieben Tagen ohne Besuch, eine installierte Web-App ist davon ausgenommen — und in diesem Speicher liegt Ihre Liste der Bereiche. Es gibt kein Konto, aus dem sie sich wiederherstellen ließe."
  a_tree_of_steps_is_one_notification: "Ein Baum aus Schritten ist eine Benachrichtigung"
  every_task_that_finishes_notifies_including_each_step_of_a_job: "Jede Aufgabe, die fertig wird, benachrichtigt, auch jeder Schritt eines Jobs. Sie stapeln sich nicht: Ein Schritt ersetzt die vorherige Benachrichtigung seines Jobs an Ort und Stelle, statt sie zu ergänzen, ein Deploy aus zehn Schritten liest sich also als eine Zeile, die sich immer wieder ändert, und nur der Abschluss des Jobs selbst meldet sich erneut."
  what_each_party_learns: "Was die Beteiligten erfahren"
  payloads_are_encrypted_for_the_browser_that_subscribed: "Nutzdaten sind für den Browser verschlüsselt, der sich angemeldet hat, mit Schlüsseln, die nur er hat. Google, Mozilla und Apple leiten Chiffretext weiter und können Ihre Aufgabentitel nicht lesen. Was sie erfahren, ist, dass ein bestimmter Browser etwas empfangen hat, und wann."
  your_own_server_learns_one_thing_it_otherwise_would_not: "Ihr eigener Server erfährt eine Sache, die er sonst nicht wüsste: dass ein Browser sich für einen bestimmten Bereich angemeldet hat. Das ist der Grund, warum es ein Knopf pro Bereich ist und keine globale Einstellung — die Liste der Bereiche, die ein Browser hält, lebt in diesem Browser und nirgendwo sonst, und eine Anmeldung ist das Einzige, was einen Bereich in die Aufzeichnungen des Servers bringt."
  if_you_are_self_hosting_push_content_minimal_html: "Wenn Sie selbst hosten, sendet %{minimal} „Task completed“ ohne Titel. Verschlüsselt sind die Nutzdaten so oder so; das hier ist für den Sperrbildschirm eines Telefons, das jemand anderes sehen kann."
  self_hosting_it_has_to_be_https: "Selbst hosten: es muss HTTPS sein"
  a_browser_hands_out_a_service_worker_only_on_a_secure_origin_html: "Ein Browser gibt einen Service Worker nur auf einem sicheren Ursprung heraus, und Web Push braucht einen. Auf %{address} erscheint der Knopf überhaupt nicht, was auch immer Ihre Schlüssel sagen — und nichts erklärt, warum, denn aus Sicht der Seite existiert die Funktion auf diesem Browser nicht. %{localhost} ist die eine Ausnahme, und genau deshalb funktioniert das, während Sie es ausprobieren, und hört auf, sobald Sie es auf eine Maschine im Netz verschieben."
  so_notifications_mean_a_certificate_html: "Benachrichtigungen bedeuten also ein Zertifikat: etwas davor, das TLS terminiert — Caddy, Traefik, nginx, ein Cloudflare-Tunnel — und %{force_ssl} auf beiden Diensten gesetzt, sobald es da ist."
  self_hosting_generating_the_keys: "Selbst hosten: die Schlüssel erzeugen"
  both_keys_unset_means_the_feature_does_not_exist_generate_a_pair_once: "Beide Schlüssel ungesetzt heißt, die Funktion existiert nicht — kein Knopf, und nichts über irgendwen gespeichert. Erzeugen Sie einmal ein Paar:"
  put_both_into_the_environment_block_of_both_services_html: "Tragen Sie beide in den %{environment}-Block %{both} Dienste in docker-compose.yml ein und führen Sie erneut %{up} aus. Nicht %{restart} — das benutzt die Konfiguration weiter, die die Container schon haben. Sie auf der App zu setzen und auf dem Worker nicht ist der Fehler, den man benennen sollte: Der Knopf erscheint, jemand drückt ihn, und nie wird etwas zugestellt."
  there_is_nothing_to_register_anywhere_lead: "Es gibt nichts, wo man sich registrieren müsste"
  there_is_nothing_to_register_anywhere_html: "%{nothing} — kein Firebase-Projekt, kein Apple-Entwicklerkonto, kein API-Schlüssel. Wer den Browser gebaut hat, betreibt den Push-Dienst; dessen Adresse kommt in der Anmeldung mit, die der Browser Ihrem Server übergibt, und das VAPID-Paar ist ein selbstsignierter Beleg dafür, dass jede Benachrichtigung vom selben Absender kam. %{subject} ist nur eine Kontaktadresse, und niemand prüft sie."
  do_not_rotate_the_keys_existing_subscriptions_are_bound_to_them: "Rotieren Sie die Schlüssel nicht. Bestehende Anmeldungen sind an sie gebunden, Browser werden nicht informiert, und sie empfangen schlicht nichts mehr."
  why_there_is_no_mobile_app: "Warum es keine mobile App gibt"
  a_react_native_app_was_designed_for_this_and_has_not_been_built: "Eine React-Native-App war dafür entworfen und ist nicht gebaut worden, weil Web Push abdeckt, wofür sie da war. Das Einzige, was sie weiterhin besser könnte, ist, mehrere Server gleichzeitig zu beobachten: Ein Browser ist an einen Ursprung gebunden, ein Bereich auf einem anderen Server öffnet sich also dort, statt sich in eine einzige Liste einzureihen. Wenn Sie einen gehosteten und einen selbst betriebenen Bereich beobachten, installieren Sie die Seite von beiden."
  everything_is_an_environment_variable: "Alles ist eine Umgebungsvariable. Es gibt keine Konfigurationsdateien zu bearbeiten und keine verschlüsselten Zugangsdaten im Image, derselbe Container läuft also auf einem NAS zu Hause und in der Cloud."
  general: "Allgemein"
  variable: "Variable"
  default: "Voreinstellung"
  what_it_does: "Wofür sie da ist"
  the_only_variable_that_is_required_in_production_html: "Die einzige Variable, die in der Produktion erforderlich ist. Erzeugen Sie eine mit %{generate} und bewahren Sie sie auf."
  where_spaces_and_task_structure_live_html: "Wo Bereiche und Aufgabenstruktur liegen. Die voreingestellte Datei ist das, was das Docker-Volume hält; zeigen Sie für eine Cloud-Installation auf %{postgres}. Der Fortschritt selbst wird hier nie geschrieben."
  set_true_when_something_in_front_terminates_tls_html: "Auf %{value} setzen, wenn etwas davor TLS terminiert. Es steuert auch %{assume}, es auszulassen hält die App also über einfaches HTTP benutzbar, statt auf ein Zertifikat umzuleiten, das Sie nicht haben."
  the_port_puma_binds_inside_the_container_html: "Der Port, an den Puma im Container bindet. %{compose} veröffentlicht ihn auf 7979, weil ein Dienst, den Sie wochenlang laufen lassen, nicht den Port belegen sollte, den Ihre eigenen Dev-Server wollen."
  logs_go_to_stdout_and_nowhere_else_this_is_how_much_of_them: "Logs gehen nach stdout und sonst nirgendwohin. Das hier ist, wie viel davon."
  how_many_spaces_and_tasks_one_address_may_create_per_hour: "Wie viele Bereiche und Aufgaben eine Adresse pro Stunde anlegen darf. Ungesetzt heißt kein Limit, was die richtige Antwort für einen Server ist, den nur Sie erreichen. Fortschritt zu berichten wird nie begrenzt."
  behind_a_proxy_the_limit_is_only_as_good_as_the_address_html: "Hinter einem Proxy ist %{limit} nur so gut wie die Adresse, die die App sieht. Rails liest %{forwarded} und vertraut dem Header aus privaten Bereichen, was ein Reverse Proxy auf demselben Host sendet — kommt der Header aber nicht an, sieht jede Anfrage wie ein einziger Client aus, und das Limit sperrt alle auf einmal aus statt niemanden."
  redis_holds_two_unrelated_things: "Redis hält zwei voneinander unabhängige Dinge: den aktuellen Fortschritt jeder Aufgabe und die Sidekiq-Warteschlange. Das sind standardmäßig zwei logische Datenbanken eines Servers, und beide lassen sich auf eine eigene Instanz verschieben."
  the_server_used_for_both_roles_split_into_db_0_and_db_1: "Der Server für beide Rollen, aufgeteilt in db 0 für Fortschritt und db 1 für die Warteschlange."
  overrides_the_progress_store_alone: "Überschreibt allein den Fortschrittsspeicher."
  overrides_the_queue_alone: "Überschreibt allein die Warteschlange."
  how_long_a_task_keeps_its_progress_without_being_written_to: "Wie lange eine Aufgabe ihren Fortschritt behält, ohne beschrieben zu werden. Jeder Bericht frischt das auf, das hier ist also eigentlich, wie lange eine aufgegebene Aufgabe auf dem Schirm bleibt."
  key_prefix_for_the_progress_store: "Schlüsselpräfix für den Fortschrittsspeicher, damit er sich eine Datenbank mit etwas anderem teilen kann."
  both_keys_unset_means_the_feature_does_not_exist_no_button_on_a_space: "Beide Schlüssel ungesetzt heißt, die Funktion existiert nicht: kein Knopf auf einem Bereich, und nichts über irgendwen gespeichert. Es gibt nichts bei Apple oder Google zu registrieren — wer den Browser gebaut hat, betreibt den Push-Dienst. Erzeugen Sie einmal ein Paar und rotieren Sie es nicht; bestehende Anmeldungen sind daran gebunden, und Browser werden nicht informiert."
  public_half_of_the_pair_that_signs_every_push: "Die öffentliche Hälfte des Paars, das jeden Push signiert. Wird dem Browser bei der Anmeldung übergeben."
  private_half_never_leaves_the_server: "Die private Hälfte. Verlässt den Server nie."
  a_contact_address_the_push_services_can_reach: "Eine Kontaktadresse, unter der die Push-Dienste Sie erreichen können, wenn etwas schiefgeht. Niemand prüft sie."
  full_puts_the_task_title_in_the_notification_html: "%{full} setzt den Aufgabentitel in die Benachrichtigung, %{minimal} sendet „Task completed“ und nichts Identifizierendes."
  process_sizing: "Prozessgrößen"
  puma_threads_per_process_and_the_size_of_both_pools: "Puma-Threads pro Prozess, und die Größe sowohl des Datenbank- als auch des Redis-Verbindungspools."
  puma_worker_processes_zero_runs_a_single_process: "Puma-Worker-Prozesse. Null lässt einen einzelnen Prozess laufen, was auf einer kleinen Maschine die richtige Antwort ist."
  threads_in_the_sidekiq_process: "Threads im Sidekiq-Prozess. Benachrichtigungen zu senden ist der einzige Job, den es gibt."
