  report_as_it_moves_this_is_the_call_that_goes_in_your_loop: "Rapportez au fil de l'avancement. C'est l'appel qui va dans votre boucle, et le seul qui connaisse les chiffres."
  close_it_this_is_what_sends_the_notification: "Fermez-la. C'est ce qui envoie la notification, appelez-le donc aussi en cas d'échec."
  or_wrap_a_process_that_is_not_yours_to_change: "Ou enveloppez un processus que vous ne pouvez pas modifier. Il rapporte le début et la fin plutôt que des chiffres, et sort avec le statut de la commande."
  in_ci_there_is_no_config_file_to_write: "En CI il n'y a pas de fichier de configuration à écrire, passez-le donc par l'environnement."
  agent_skill: "Skill d'agent"
  give_an_ai_agent_a_progress_skill: "Donner à un agent IA un skill de progression"
  give_an_ai_agent_a_skill_for_reporting_its_own_progress: "Donnez à un agent IA un skill pour rapporter sa propre progression dans Progress Watch."
  the_skill_drives_the_cli_so_the_agent_needs_no_server_or_uuid_of_its_own: "Le skill pilote la CLI, l'agent n'a donc besoin ni de serveur ni d'uuid propres — il utilise ce pour quoi cette machine est déjà configurée."
  install_the_cli_the_skill_is_a_set_of_instructions_for_driving_it: "Installez la CLI. Le skill est un jeu d'instructions pour la piloter."
  point_it_at_this_server_saved_to_progresswatchrc: "Pointez-la vers ce serveur. Enregistré dans ~/.progresswatchrc, c'est donc une seule fois."
  create_a_space_for_the_agent_to_report_into: "Créez un espace où l'agent pourra rapporter."
  point_it_at_this_space_use_local_to_bind_it_to_one_project: "Pointez-la vers cet espace. Utilisez --local pour le lier à un seul projet."
  install_the_skill_it_knows_75_agents: "Installez le skill. Il connaît plus de 75 agents et demande pour lequel installer."
  that_is_all_the_agent_decides_on_its_own_when_work_is_worth_tracking: "C'est tout — l'agent décide seul quand un travail mérite d'être suivi, crée une tâche pour le travail et une sous-tâche par étape, et ferme chacune à mesure qu'elle se termine. Si vous préférez ne pas lancer l'installeur de quelqu'un d'autre, le même fichier est skills/progresswatch-cli/SKILL.md dans ce dépôt, et il va dans .claude/skills/."
  mcp: "MCP"
  connect_an_agent_over_mcp: "Connecter un agent en MCP"
  connect_an_ai_agent_to_progress_watch_over_mcp: "Connectez un agent IA à Progress Watch en MCP."
  add_the_server: "Ajoutez le serveur."
  or_write_it_into_mcp_json_yourself: "Ou écrivez-le vous-même dans .mcp.json."
  the_space_uuid_sits_in_the_url_so_any_client_that_takes_only_a_url_works: "L'uuid de l'espace est dans l'URL, n'importe quel client qui n'accepte qu'une URL fonctionne donc. Pour le sortir du chemin, envoyez-le plutôt en en-tête."
  four_tools_create_space_create_task_update_task_complete_task: "Quatre outils : create_space, create_task, update_task, complete_task. L'agent décide seul quand créer une tâche et à quelle fréquence rapporter. Un agent connecté sans espace peut appeler create_space et vous rendre l'URL, il n'est donc jamais coincé sans endroit où rapporter."
  curl: "curl"
  try_the_api_with_curl: "Essayer l'API avec curl"
  try_the_api_with_curl_and_report_from_a_client_that_can_only_fire_a_url: "Essayez l'API Progress Watch avec curl, et rapportez depuis un client qui ne peut que déclencher une URL."
  create_a_space_keep_its_uuid_whoever_has_it_can_read_and_write_here: "Créez un espace, gardez son uuid. Quiconque l'a peut lire et écrire ici."
  create_a_task_keep_its_uuid: "Créez une tâche, gardez son uuid."
  report_progress_every_write_replaces_the_whole_state: "Rapportez la progression. Chaque écriture remplace l'état entier — envoyez tout à chaque fois."
  finish_it_this_is_what_sends_the_notification: "Terminez-la. C'est ce qui envoie la notification."
  that_is_the_whole_surface_and_it_is_what_the_cli_and_the_mcp_tools_call: "C'est toute la surface, et c'est ce qu'appellent la CLI et les outils MCP. Pour quelque chose que vous lancez tous les jours, la CLI c'est une ligne au lieu de quatre ; pour construire dessus, la référence de l'API et OpenAPI 3.1 sont sur /openapi.json."
  one_more_for_a_client_that_cannot_do_the_above: "Encore une, pour un client incapable de ce qui précède. Certaines choses ne peuvent recevoir qu'une URL — un pinger d'uptime, un champ webhook dans le produit de quelqu'un d'autre, un routeur ou un capteur, une ligne de cron avec un curl nu. Ils ne peuvent ni choisir une méthode ni envoyer un corps, la même écriture est donc joignable par un simple GET."
  the_g_is_for_curl_not_for_us: "Le -g est pour curl, pas pour nous : curl lit les crochets d'une URL comme une plage et refuse l'adresse sans lui. Tout ce qui se contente de déclencher une URL n'a besoin de rien de particulier."
  use_it_only_when_there_is_no_alternative_it_is_a_get_that_writes: "Ne l'utilisez que faute d'alternative. C'est un GET qui écrit, donc tout ce qui suit l'URL effectue l'écriture : collez-la dans une conversation et l'aperçu du lien rapporte à votre place. Si votre client peut envoyer un corps de requête, le PUT ci-dessus est celui à utiliser."
  docker: "Docker"
  self_host_progress_watch_with_docker: "Auto-héberger Progress Watch avec Docker"
  the_docker_compose_file_for_running_your_own_server: "Le fichier Docker Compose pour faire tourner votre propre serveur Progress Watch."
  your_own_server_on_your_own_box: "Votre propre serveur, sur votre propre machine. Rien ici ne parle à progress.watch."
  save_this_as_docker_compose_yml_it_runs_the_published_image: "Enregistrez ceci sous docker-compose.yml. Il lance l'image publiée, il n'y a donc rien à cloner ni à construire — et il est à vous à partir d'ici."
  generate_a_secret_and_paste_it_over_the_placeholder: "Générez un secret et collez-le par-dessus l'exemple, dans les deux services."
  start_it_the_app_a_redis_and_a_sqlite_file: "Démarrez-le. L'application, un Redis et un fichier SQLite sur un volume."
  then_point_the_cli_at_it_this_page_is_served_from_server: "Pointez ensuite la CLI dessus. Cette page est servie depuis {{server}}."
  that_is_a_working_server_notifications_postgres_and_the_one_click_deploy: "Voilà un serveur qui marche. Les notifications, Postgres, la seule chose qui mérite un cron et le déploiement en un clic sont tous dans Auto-hébergement, dans la barre latérale."
  an_introduction_to_progress_watch_an_open_source_progress_tracker: "Une introduction à Progress Watch, un suivi de progression open source pour tout ce qui tourne sans vous."
  watch_any_process: "Surveillez n'importe quel processus"
  some_things_run_for_hours_with_nobody_watching: "Certaines choses tournent des heures sans que personne ne regarde : un crawl nocturne, un entraînement, une migration, un pipeline de CI, un agent qui avance dans une longue tâche. Progress Watch leur donne un endroit où rapporter, et vous donne un endroit où regarder — plus une notification quand elles se terminent."
  three_commands_from_inside_the_work: "Trois commandes depuis l'intérieur du travail"
  create_a_task_where_the_job_starts_report_against_it_as_it_moves: "Créez une tâche là où le travail commence, rapportez dessus au fil de l'avancement, fermez-la quand c'est fini. Celle du milieu est l'appel qui va dans votre boucle, et la seule chose qui connaisse les chiffres."
  counts_not_percentages_the_screen_shows_html: "Des comptes, pas des pourcentages : l'écran affiche %{counts}, ce qui vous dit quelque chose que %{percent} ne dit pas. Le total peut changer à mesure qu'un travail découvre de la besogne — envoyez le nouveau nombre et la barre se recalcule. La page %{cli} a les trois, prêtes à coller."
  when_the_process_is_not_yours_to_change_html: "Quand le processus n'est pas à vous, %{run} l'enveloppe entièrement — il crée la tâche, laisse passer la sortie intacte et la ferme avec le code de sortie, si bien qu'un travail qui échoue vous notifie quand même. Il rapporte le début et la fin plutôt que des comptes, parce que rien à l'extérieur d'un processus ne sait où il en est."
  or_one_request_from_anything: "Ou une requête, depuis n'importe quoi"
  underneath_all_of_it_is_a_single_http_request_html: "Sous tout cela, il y a une seule requête HTTP, et c'est toute l'API. Il n'y a pas de SDK à installer ni rien à importer, car envelopper un %{put} n'ajouterait rien que vous ne puissiez écrire vous-même en moins de temps qu'il n'en faut pour lire sa documentation."
  api_reference: "référence de l'API"
  the_api_reference_is_the_reference_to_build_against_html: "La %{api} est la référence sur laquelle bâtir, et coller les exemples %{curl} est le moyen le plus rapide de voir la chose marcher avant de vous engager."
  agents_report_their_own_work: "Les agents rapportent leur propre travail"
  agent_skill_lowercase: "skill d'agent"
  an_ai_agent_breaks_a_job_into_steps_html: "Un agent IA découpe un travail en étapes puis travaille longtemps sans rien à montrer. Connectez-en un en %{mcp} et il obtient des outils pour créer une tâche et rapporter dessus : une tâche pour le travail, une sous-tâche par étape, mises à jour au fil de l'eau. MCP ne nécessite aucune installation nulle part ; pour un client qui ne le parle pas, un %{skill} enseigne la même chose via la CLI."
  the_agent_decides_when_tracking_is_worth_it_and_how_often_to_report: "L'agent décide quand le suivi en vaut la peine et à quelle fréquence rapporter. Les descriptions des outils lui disent à quoi sert une tâche, pas un calendrier à suivre."
  no_accounts: "Pas de comptes"
  a_space_is_a_container_for_tasks_and_its_uuid_is_the_credential: "Un espace est un conteneur de tâches, et son UUID est l'identifiant. Quiconque a le lien peut le lire et y écrire ; partager, c'est donner le lien à quelqu'un. Il n'y a rien à créer, rien où se connecter et aucun mot de passe à perdre — ce qui veut aussi dire que le lien est le seul chemin de retour vers un espace, et qu'il vaut donc d'être gardé comme un jeton d'API."
  progress_is_not_stored: "La progression n'est pas stockée"
  current_state_lives_in_memory_and_expires_on_its_own: "L'état courant vit en mémoire et expire tout seul. Un crawler qui rapporte chaque seconde pendant trois mois ne fait pas grossir de base de données, et il n'y a rien à nettoyer ensuite. Le compromis est délibéré : il n'y a ni historique ni graphiques, seulement ce qui se passe maintenant."
  what_it_will_not_do: "Ce qu'il ne fera pas"
  send_commands_back: "Renvoyer des commandes."
  it_is_a_departures_board_not_an_orchestrator: "C'est un tableau des départs, pas un orchestrateur. Un processus rapporte ; rien ne lui rapporte."
  keep_a_log: "Garder un journal."
  one_line_the_latest_per_task: "Une ligne, la dernière, par tâche. Le stockage de logs est un problème résolu et ce n'est pas ici."
  nest_more_than_one_level: "Imbriquer sur plus d'un niveau."
  a_task_may_have_steps_a_step_may_not: "Une tâche peut avoir des étapes ; une étape non."
  run_it_yourself: "Faites-le tourner vous-même"
  the_docker_snippet: "l'extrait Docker"
  self_hosting_lowercase: "auto-hébergement"
  the_server_is_open_source_and_self_hosting_is_one_container_html: "Le serveur est open source et l'auto-hébergement, c'est un conteneur plus un Redis — voyez %{docker} pour le démarrer et %{self_hosting} pour le faire tourner correctement. Le service hébergé existe pour que vous n'ayez pas à le faire, pas parce que le logiciel serait bridé sans lui."
  nothing_to_sign_up_for: "Rien à créer"
  make_a_space_keep_its_link_and_start_reporting_into_it: "Créez un espace, gardez son lien, et commencez à y rapporter depuis n'importe quoi."
  create_a_space: "Créer un espace"
  watch_any_script_crawler_ci_job_or_agent: "Surveillez n'importe quel script, crawler, job de CI ou agent. Il rapporte sa progression par une seule requête HTTP ; vous regardez d'où vous êtes et recevez une notification quand il se termine. Open source, auto-hébergeable."
  the_server_is_open_source_under_the_agpl: "Le serveur est open source sous licence AGPL, et le service hébergé fait tourner la même image que vous. L'auto-hébergement coûte un conteneur et un Redis, et la base de données reste petite pour toujours parce que la progression n'y est jamais écrite."
  one_file: "Un seul fichier"
  the_docker_page: "la page Docker"
  docker_compose_yml_is_the_whole_install_html: "%{file} est toute l'installation. Il lance l'image publiée, il n'y a donc rien à cloner et rien à construire — copiez-le depuis %{docker}, qui affiche le fichier courant, remplacez le secret d'exemple et démarrez :"
  that_is_the_whole_setup_the_app_on_localhost_html: "C'est toute l'installation : l'application sur %{url}, un worker, un Redis et un fichier SQLite sur un volume nommé. Ouvrez-la, créez un espace, et le menu Connecter de cet espace vous donne des commandes avec son UUID déjà rempli."
  configuring_it: "Le configurer"
  both_services: "deux"
  the_file_is_yours_from_the_moment_you_save_it_html: "Le fichier est à vous dès l'instant où vous l'enregistrez, et c'est le seul endroit où quoi que ce soit se configure — chaque réglage est une ligne d'un bloc %{environment}, en ajouter un revient donc à ajouter une ligne :"
  environment_variables_is_the_full_list_html: "%{link} est la liste complète, et tout ce qui s'y trouve fonctionne ici. Pour publier ailleurs que sur 7979, changez la partie gauche de %{ports} — l'application dans le conteneur est toujours sur 3000."
  what_is_running: "Ce qui tourne"
  two_processes_and_a_file_the_app_answers_requests: "Deux processus et un fichier. L'application répond aux requêtes et exécute le worker en son sein — Sidekiq est embarqué dans Puma, donc il ne manque à une notification aucun service dédié. Redis conserve la progression actuelle de chaque tâche et la file de jobs ; SQLite conserve les espaces et la forme de chaque tâche."
  updating_it: "Le mettre à jour"
  name_the_service_a_bare_pull_takes_redis_with_it_html: "Nommez le service. Un %{pull} seul récupère aussi Redis, et si un %{redis} plus récent a été publié, %{up} remplace ce conteneur également — ce qui jette la progression de tout ce qui tourne."
  replacing_only_the_app_container_leaves_every_running_task_where_it_was_html: "Remplacer seulement le conteneur de l'application laisse chaque tâche en cours exactement où elle était, car la progression est dans Redis et Redis n'a pas été touché. Les titres et la structure sont sur le volume et survivent de toute façon. Rien ne survit à %{down} ni à un redémarrage de l'hôte : Redis ne garde rien sur disque, délibérément."
  why_7979: "Pourquoi 7979"
  not_3000_this_is_a_service_you_leave_running_for_weeks_html: "Pas 3000. C'est un service que vous laissez tourner des semaines pendant que vous travaillez, et 3000 est là où atterrissent vos propres serveurs de développement — Rails, Vite, Next, Grafana et la moitié des lignes %{run} des autres guides. Un service d'arrière-plan ne devrait pas occuper le port le plus disputé de la machine, encore moins un dont vous collez l'URL dans un secret de CI avant de l'oublier."
  inside_the_container_it_is_still_3000_html: "À l'intérieur du conteneur c'est toujours 3000 ; seul le port publié a bougé, et c'est la ligne %{ports}."
  losing_the_volume_is_recoverable: "Perdre le volume est réparable"
  spaces_and_task_structure_are_on_it_and_nothing_else: "Les espaces et la structure des tâches y sont, et rien d'autre. S'il disparaît, vous créez un nouvel espace et vos processus repeuplent tout à leur requête suivante. Sauvegardez-le si vous préférez ne pas redistribuer un nouvel UUID d'espace à tout ce qui rapporte dedans — mais il n'y a rien dessus qui ne puisse être reconstruit en relançant les travaux."
  sqlite_or_postgresql: "SQLite ou PostgreSQL"
  both_from_the_same_image_and_the_same_migrations_html: "Les deux, depuis la même image et les mêmes migrations, choisis par %{database_url}. SQLite est la valeur par défaut et la bonne réponse pour une seule machine : deux tables, des accès par clé primaire, presque jamais d'écriture. Pointez vers %{postgres} quand vous faites tourner plusieurs conteneurs de l'application, car ils ne peuvent pas partager un fichier."
  behind_a_proxy: "Derrière un proxy"
  set_force_ssl_true_once_something_in_front_terminates_tls_html: "Mettez %{force_ssl} dès que quelque chose devant l'application termine le TLS. C'est désactivé par défaut pour qu'une installation atteinte en HTTP simple ne vous redirige pas vers un certificat que vous n'avez pas."
  notifications_lowercase: "notifications"
  set_a_vapid_key_pair_and_a_notify_me_button_appears_html: "Posez une paire de clés VAPID et un bouton « %{notify} » apparaît sur chaque espace ; laissez les clés vides et la fonctionnalité n'existe pas. Il n'y a rien à enregistrer chez Apple ou Google. Voyez %{link} pour toute l'histoire, y compris ce qui doit se passer sur un téléphone."
  sweeping_empty_spaces: "Balayer les espaces vides"
  ever: "un jour"
  opening_the_site_creates_a_space_for_you_html: "Ouvrir le site crée un espace pour vous, il s'en crée donc beaucoup qui ne servent jamais — y compris par tout ce qui explore la page. Un espace qui a %{ever} contenu une tâche est conservé pour de bon, quel que soit le temps que personne n'y regarde. Seuls ceux qui n'ont jamais contenu la moindre tâche sont balayés, et seulement une fois qu'ils ont plus de 30 jours."
  nothing_runs_it_for_you_schedule_it_however_you_already_schedule_things: "Rien ne le lance pour vous. Planifiez-le comme vous planifiez déjà les choses :"
  crontab_daily_at_0417: "crontab, chaque jour à 04:17"
  because_nothing_is_on_a_timer_30_days_is_a_floor: "Comme rien n'est sur une minuterie, 30 jours est un plancher et non un calendrier : lancez-le chaque jour et les espaces vides partent le jour où ils y ont droit, une fois par an et ils restent jusque-là. Le sauter ne risque rien pour vos données — le balayage ne prend que des lignes jamais utilisées — cela signifie simplement que la table grossit d'espaces que personne n'a jamais ouverts."
  your_instance_is_not_indexable: "Votre instance n'est pas indexable"
  every_page_of_a_self_hosted_install_is_noindex_html: "Chaque page d'une installation auto-hébergée est en %{noindex}, %{robots} interdit tout, et %{sitemap} répond 404. Depuis la machine de quelqu'un il n'y a pas de public à atteindre et rien là-dedans qui souhaite être trouvé dans une recherche, et il n'y a rien à configurer pour cela — c'est ce que vous obtenez."
  the_point_of_the_whole_product_is_the_moment_a_job_finishes: "Tout l'intérêt du produit tient au moment où un travail se termine pendant que vous êtes ailleurs. Progress Watch le délivre par Web Push, directement du serveur à votre navigateur — bureau et téléphone par un seul mécanisme, sans rien entre les deux qui nous appartienne."
  turning_it_on: "L'activer"
  push_is_opt_in_per_space_open_a_space_press_html: "Le push se choisit espace par espace. Ouvrez un espace, appuyez sur %{notify}, et ce navigateur est enregistré pour cet espace et pour aucun autre. Rien vous concernant n'est stocké tant que vous n'appuyez pas, et retirer l'espace le désinscrit."
  on_a_phone_install_the_site_first: "Sur un téléphone, installez d'abord le site"
  add_to_home_screen: "Sur l'écran d'accueil"
  ios_delivers_web_push_only_to_a_site_added_to_the_home_screen_html: "iOS ne délivre le Web Push qu'à un site ajouté à l'écran d'accueil, et il n'y a pas moyen de contourner cela : ouvrez l'espace dans Safari, Partager, %{add}, et appuyez sur Me notifier depuis là. Android et le bureau fonctionnent depuis un onglet ordinaire."
  installing_has_a_second_benefit_on_ios: "L'installation a un second avantage sur iOS. Safari efface le stockage local d'un site ordinaire après sept jours sans visite, et une application web installée en est exemptée — et c'est dans ce stockage que vit votre liste d'espaces. Il n'y a aucun compte depuis lequel la restaurer."
  a_tree_of_steps_is_one_notification: "Un arbre d'étapes fait une notification"
  every_task_that_finishes_notifies_including_each_step_of_a_job: "Chaque tâche qui se termine notifie, y compris chaque étape d'un travail. Elles ne s'empilent pas : une étape remplace sur place la notification précédente de son travail au lieu de s'y ajouter, un déploiement en dix étapes se lit donc comme une ligne qui change, et seule la fin du travail lui-même vibre à nouveau."
  what_each_party_learns: "Ce que chaque partie apprend"
  payloads_are_encrypted_for_the_browser_that_subscribed: "Les charges utiles sont chiffrées pour le navigateur qui s'est abonné, avec des clés que lui seul détient. Google, Mozilla et Apple relaient du texte chiffré et ne peuvent pas lire les titres de vos tâches. Ce qu'ils apprennent, c'est qu'un navigateur donné a reçu quelque chose, et quand."
  your_own_server_learns_one_thing_it_otherwise_would_not: "Votre propre serveur apprend une chose qu'il ignorerait autrement : qu'un navigateur s'est abonné sur un espace donné. C'est la raison pour laquelle c'est un bouton par espace et non un réglage global — la liste des espaces d'un navigateur vit dans ce navigateur et nulle part ailleurs, et un abonnement est la seule chose qui fasse entrer un espace dans les registres du serveur."
  if_you_are_self_hosting_push_content_minimal_html: "Si vous auto-hébergez, %{minimal} envoie « Task completed » sans titre. La charge est chiffrée dans les deux cas ; ceci concerne l'écran verrouillé d'un téléphone que quelqu'un d'autre peut voir."
  self_hosting_it_has_to_be_https: "Auto-hébergement : il faut du HTTPS"
  a_browser_hands_out_a_service_worker_only_on_a_secure_origin_html: "Un navigateur ne délivre un service worker que sur une origine sécurisée, et le Web Push en exige une. Sur %{address} le bouton n'apparaît pas du tout, quoi que disent vos clés — et rien n'explique pourquoi, car du point de vue de la page la fonctionnalité n'existe pas sur ce navigateur. %{localhost} est la seule exception, ce qui est précisément pourquoi cela marche pendant que vous l'essayez et s'arrête dès que vous le déplacez sur une machine du réseau."
  so_notifications_mean_a_certificate_html: "Notifications signifie donc certificat : quelque chose devant qui termine le TLS — Caddy, Traefik, nginx, un tunnel Cloudflare — et %{force_ssl} posé sur les deux services une fois que c'est en place."
  self_hosting_generating_the_keys: "Auto-hébergement : générer les clés"
  both_keys_unset_means_the_feature_does_not_exist_generate_a_pair_once: "Les deux clés vides signifient que la fonctionnalité n'existe pas — pas de bouton, et rien de stocké sur qui que ce soit. Générez une paire une fois :"
  put_both_into_the_environment_block_of_both_services_html: "Mettez les deux dans le bloc %{environment} des %{both} services de docker-compose.yml et relancez %{up}. Pas %{restart} — cela réutilise la configuration que les conteneurs ont déjà. Les poser sur l'application et pas sur le worker est l'échec qui mérite d'être nommé : le bouton apparaît, quelqu'un appuie, et rien n'est jamais délivré."
  there_is_nothing_to_register_anywhere_lead: "Il n'y a rien à enregistrer nulle part"
  there_is_nothing_to_register_anywhere_html: "%{nothing} — pas de projet Firebase, pas de compte développeur Apple, pas de clé d'API. Celui qui a fait le navigateur exploite le service de push ; son adresse arrive dans l'abonnement que le navigateur remet à votre serveur, et la paire VAPID est la preuve auto-signée que chaque notification vient du même expéditeur. %{subject} n'est qu'une adresse de contact et personne ne la vérifie."
  do_not_rotate_the_keys_existing_subscriptions_are_bound_to_them: "Ne faites pas tourner les clés. Les abonnements existants y sont liés, les navigateurs n'en sont pas informés, et ils cessent simplement de recevoir."
  why_there_is_no_mobile_app: "Pourquoi il n'y a pas d'application mobile"
  a_react_native_app_was_designed_for_this_and_has_not_been_built: "Une application React Native avait été conçue pour cela et n'a pas été construite, parce que le Web Push couvre ce à quoi elle servait. La seule chose qu'elle ferait encore mieux, c'est surveiller plusieurs serveurs à la fois : un navigateur est lié à une origine, donc un espace sur un autre serveur s'ouvre sur ce serveur au lieu de rejoindre une liste unique. Si vous surveillez un espace hébergé et un espace auto-hébergé, installez le site depuis chacun."
  everything_is_an_environment_variable: "Tout est une variable d'environnement. Il n'y a pas de fichiers de configuration à éditer et pas d'identifiants chiffrés cuits dans l'image, le même conteneur tourne donc sur un NAS domestique et dans le cloud."
  general: "Général"
  variable: "Variable"
  default: "Défaut"
  what_it_does: "Ce qu'elle fait"
  the_only_variable_that_is_required_in_production_html: "La seule variable obligatoire en production. Générez-en une avec %{generate} et gardez-la."
  where_spaces_and_task_structure_live_html: "Où vivent les espaces et la structure des tâches. Le fichier par défaut est ce que contient le volume Docker ; pointez vers %{postgres} pour un déploiement cloud. La progression elle-même n'est jamais écrite ici."
  set_true_when_something_in_front_terminates_tls_html: "Mettez %{value} quand quelque chose devant termine le TLS. Cela pilote aussi %{assume}, laisser désactivé garde donc l'application utilisable en HTTP simple au lieu de rediriger vers un certificat que vous n'avez pas."
  the_port_puma_binds_inside_the_container_html: "Le port sur lequel Puma écoute dans le conteneur. %{compose} le publie sur 7979, parce qu'un service laissé tourner des semaines ne devrait pas occuper le port que veulent vos propres serveurs de développement."
  logs_go_to_stdout_and_nowhere_else_this_is_how_much_of_them: "Les logs vont sur stdout et nulle part ailleurs. Ceci en règle la quantité."
  how_many_spaces_and_tasks_one_address_may_create_per_hour: "Combien d'espaces et de tâches une adresse peut créer par heure. Non défini signifie aucune limite, ce qui est la bonne réponse pour un serveur que vous seul pouvez atteindre. Rapporter la progression n'est jamais limité."
  behind_a_proxy_the_limit_is_only_as_good_as_the_address_html: "Derrière un proxy, %{limit} ne vaut que ce que vaut l'adresse que voit l'application. Rails lit %{forwarded} et lui fait confiance depuis les plages privées, ce qu'envoie un reverse proxy sur le même hôte — mais si l'en-tête n'arrive pas, chaque requête ressemble à un seul client et la limite bloque tout le monde d'un coup plutôt que personne."
  redis_holds_two_unrelated_things: "Redis contient deux choses sans rapport : la progression courante de chaque tâche, et la file Sidekiq. Ce sont par défaut deux bases logiques d'un même serveur, et chacune peut être déplacée sur sa propre instance."
  the_server_used_for_both_roles_split_into_db_0_and_db_1: "Le serveur utilisé pour les deux rôles, réparti en db 0 pour la progression et db 1 pour la file."
  overrides_the_progress_store_alone: "Remplace le stockage de progression seul."
  overrides_the_queue_alone: "Remplace la file seule."
  how_long_a_task_keeps_its_progress_without_being_written_to: "Combien de temps une tâche garde sa progression sans être écrite. Chaque rapport la rafraîchit, ceci revient donc à la durée pendant laquelle une tâche abandonnée reste à l'écran."
  key_prefix_for_the_progress_store: "Préfixe de clé du stockage de progression, pour qu'il puisse partager une base avec autre chose."
  both_keys_unset_means_the_feature_does_not_exist_no_button_on_a_space: "Les deux clés vides signifient que la fonctionnalité n'existe pas : pas de bouton sur un espace, et rien de stocké sur qui que ce soit. Il n'y a rien à enregistrer chez Apple ou Google — celui qui a fait le navigateur exploite le service de push. Générez une paire une fois et ne la faites pas tourner ; les abonnements existants y sont liés et les navigateurs n'en sont pas informés."
  public_half_of_the_pair_that_signs_every_push: "Moitié publique de la paire qui signe chaque push. Remise au navigateur quand il s'abonne."
  private_half_never_leaves_the_server: "Moitié privée. Ne quitte jamais le serveur."
  a_contact_address_the_push_services_can_reach: "Une adresse de contact que les services de push peuvent joindre si quelque chose tourne mal. Personne ne la vérifie."
  full_puts_the_task_title_in_the_notification_html: "%{full} met le titre de la tâche dans la notification, %{minimal} envoie « Task completed » et rien d'identifiant."
  process_sizing: "Dimensionnement des processus"
  puma_threads_per_process_and_the_size_of_both_pools: "Threads Puma par processus, et taille du pool de connexions à la base comme à Redis."
  puma_worker_processes_zero_runs_a_single_process: "Processus worker de Puma. Zéro fait tourner un seul processus, ce qui est la bonne réponse sur une petite machine."
  threads_in_the_sidekiq_process: "Threads du processus Sidekiq. Envoyer des notifications est le seul travail qui existe."
  sidekiq_runs_inside_puma_set_false_to_run_it_as_its_own_process: "Sidekiq tourne dans Puma. Mettez `false` là où un processus worker dédié tourne."
