  in_ci_there_is_no_config_file_to_write: "En CI no hay archivo de configuración que escribir, así que pásalo por el entorno."
  agent_skill: "Skill de agente"
  give_an_ai_agent_a_progress_skill: "Dar a un agente de IA un skill de progreso"
  give_an_ai_agent_a_skill_for_reporting_its_own_progress: "Dale a un agente de IA un skill para reportar su propio progreso a Progress Watch."
  the_skill_drives_the_cli_so_the_agent_needs_no_server_or_uuid_of_its_own: "El skill maneja la CLI, así que el agente no necesita servidor ni uuid propios: usa aquello para lo que ya está configurada esta máquina."
  install_the_cli_the_skill_is_a_set_of_instructions_for_driving_it: "Instala la CLI. El skill es un conjunto de instrucciones para manejarla."
  point_it_at_this_server_saved_to_progresswatchrc: "Apúntala a este servidor. Se guarda en ~/.progresswatchrc, así que es cosa de una vez."
  create_a_space_for_the_agent_to_report_into: "Crea un espacio para que el agente reporte en él."
  point_it_at_this_space_use_local_to_bind_it_to_one_project: "Apúntala a este espacio. Usa --local para atarlo a un solo proyecto."
  install_the_skill_it_knows_75_agents: "Instala el skill. Conoce más de 75 agentes y pregunta para cuál instalarlo."
  that_is_all_the_agent_decides_on_its_own_when_work_is_worth_tracking: "Eso es todo: el agente decide por su cuenta cuándo vale la pena seguir un trabajo, crea una tarea para el trabajo y una subtarea por paso, y cierra cada una según termina. Si prefieres no ejecutar el instalador de otro, el mismo archivo es skills/progresswatch-cli/SKILL.md en ese repositorio, y va en .claude/skills/."
  mcp: "MCP"
  connect_an_agent_over_mcp: "Conectar un agente por MCP"
  connect_an_ai_agent_to_progress_watch_over_mcp: "Conecta un agente de IA a Progress Watch por MCP."
  add_the_server: "Añade el servidor."
  or_write_it_into_mcp_json_yourself: "O escríbelo tú mismo en .mcp.json."
  the_space_uuid_sits_in_the_url_so_any_client_that_takes_only_a_url_works: "El uuid del espacio va en la URL, así que sirve cualquier cliente que solo acepte una URL. Para mantenerlo fuera de la ruta, mándalo como cabecera."
  four_tools_create_space_create_task_update_task_complete_task: "Cuatro herramientas: create_space, create_task, update_task, complete_task. El agente decide por su cuenta cuándo crear una tarea y con qué frecuencia reportar. Uno conectado sin espacio puede llamar a create_space y devolverte la URL, así que nunca se queda sin sitio donde reportar."
  curl: "curl"
  try_the_api_with_curl: "Probar la API con curl"
  try_the_api_with_curl_and_report_from_a_client_that_can_only_fire_a_url: "Prueba la API de Progress Watch con curl, y reporta desde un cliente que solo puede lanzar una URL."
  create_a_space_keep_its_uuid_whoever_has_it_can_read_and_write_here: "Crea un espacio, guarda su uuid. Quien lo tenga puede leer y escribir aquí."
  create_a_task_keep_its_uuid: "Crea una tarea, guarda su uuid."
  report_progress_every_write_replaces_the_whole_state: "Reporta progreso. Cada escritura reemplaza el estado entero: manda todo cada vez."
  finish_it_this_is_what_sends_the_notification: "Termínala. Esto es lo que envía la notificación."
  that_is_the_whole_surface_and_it_is_what_the_cli_and_the_mcp_tools_call: "Esa es toda la superficie, y es lo que llaman la CLI y las herramientas de MCP. Para algo que ejecutas a diario la CLI es una línea en vez de cuatro; para construir sobre ello, la referencia de la API y OpenAPI 3.1 están en /openapi.json."
  one_more_for_a_client_that_cannot_do_the_above: "Uno más, para un cliente que no puede hacer lo anterior. A algunas cosas solo se les puede dar una URL: un vigilante de disponibilidad, un campo de webhook en el producto de otro, un router o un sensor, una línea de cron con un curl pelado. No pueden elegir método ni enviar cuerpo, así que la misma escritura está disponible como un GET simple."
  the_g_is_for_curl_not_for_us: "El -g es para curl, no para nosotros: curl lee los corchetes de una URL como un rango y rechaza la dirección sin él. Cualquier cosa que se limite a lanzar una URL no necesita nada especial."
  use_it_only_when_there_is_no_alternative_it_is_a_get_that_writes: "Úsalo solo cuando no haya alternativa. Es un GET que escribe, así que cualquier cosa que siga la URL ejecuta la escritura: pégala en un chat y la vista previa del enlace reporta por ti. Si tu cliente puede enviar un cuerpo de petición, el PUT de arriba es el bueno."
  docker: "Docker"
  self_host_progress_watch_with_docker: "Alojar Progress Watch con Docker"
  the_docker_compose_file_for_running_your_own_server: "El archivo de Docker Compose para ejecutar tu propio servidor de Progress Watch."
  your_own_server_on_your_own_box: "Tu propio servidor, en tu propia máquina. Nada de esto habla con progress.watch."
  save_this_as_docker_compose_yml_it_runs_the_published_image: "Guarda esto como docker-compose.yml. Ejecuta la imagen publicada, así que no hay nada que clonar ni nada que compilar, y de aquí en adelante es tuyo para editar."
  generate_a_secret_and_paste_it_over_the_placeholder: "Genera un secreto y pégalo encima del de ejemplo."
  start_it_the_app_a_redis_and_a_sqlite_file: "Arráncalo. La aplicación, un Redis y un archivo SQLite en un volumen."
  then_point_the_cli_at_it_this_page_is_served_from_server: "Luego apunta la CLI ahí. Esta página se sirve desde {{server}}."
  that_is_a_working_server_notifications_postgres_and_the_one_click_deploy: "Ese es un servidor que funciona. Las notificaciones, Postgres, lo único que merece un cron y el despliegue de un clic están todos en Alojarlo tú mismo, en la barra lateral."
  an_introduction_to_progress_watch_an_open_source_progress_tracker: "Una introducción a Progress Watch, un seguidor de progreso de código abierto para cualquier cosa que corra sin ti."
  watch_any_process: "Vigila cualquier proceso"
  some_things_run_for_hours_with_nobody_watching: "Algunas cosas corren durante horas sin que nadie las mire: un rastreo nocturno, un entrenamiento, una migración, una tubería de CI, un agente abriéndose paso por una tarea larga. Progress Watch les da un sitio al que reportar, y a ti un sitio donde mirar, más un aviso cuando terminan."
  three_commands_from_inside_the_work: "Tres comandos desde dentro del trabajo"
  create_a_task_where_the_job_starts_report_against_it_as_it_moves: "Crea una tarea donde empieza el trabajo, repórtala según avanza, ciérrala cuando esté hecho. El del medio es la llamada que va en tu bucle, y es lo único que conoce los números."
  counts_not_percentages_the_screen_shows_html: "Cuentas, no porcentajes: la pantalla muestra %{counts}, que te dice algo que %{percent} no dice. El total puede cambiar según el trabajo descubre más faena: manda el número nuevo y la barra se recalcula. La página %{cli} tiene los tres, listos para pegar."
  when_the_process_is_not_yours_to_change_html: "Cuando el proceso no está en tu mano cambiarlo, %{run} lo envuelve entero: crea la tarea, deja pasar la salida intacta y la cierra con el código de salida, así que un trabajo que falla también te avisa. Reporta inicio y fin en vez de cuentas, porque nada fuera de un proceso sabe cuánto lleva hecho."
  or_one_request_from_anything: "O una petición, desde cualquier cosa"
  underneath_all_of_it_is_a_single_http_request_html: "Debajo de todo hay una sola petición HTTP, y esa es toda la API. No hay SDK que instalar ni nada que importar, porque envolver un %{put} no añadiría nada que no pudieras escribir tú en menos tiempo del que se tarda en leer su documentación."
  api_reference: "referencia de la API"
  the_api_reference_is_the_reference_to_build_against_html: "La %{api} es la referencia contra la que construir, y pegar los ejemplos de %{curl} es la forma más rápida de ver la cosa funcionar antes de comprometerte."
  agents_report_their_own_work: "Los agentes reportan su propio trabajo"
  agent_skill_lowercase: "skill de agente"
  an_ai_agent_breaks_a_job_into_steps_html: "Un agente de IA divide un trabajo en pasos y luego trabaja largo rato sin nada que enseñar. Conecta uno por %{mcp} y obtiene herramientas para crear una tarea y reportar contra ella: una tarea para el trabajo, una subtarea por paso, actualizadas sobre la marcha. MCP no necesita instalar nada en ninguna parte; para un cliente que no lo habla, un %{skill} enseña lo mismo a través de la CLI."
  the_agent_decides_when_tracking_is_worth_it_and_how_often_to_report: "El agente decide cuándo merece la pena seguir algo y con qué frecuencia reportar. Las descripciones de las herramientas le dicen para qué sirve una tarea, no un horario que seguir."
  no_accounts: "Sin cuentas"
  a_space_is_a_container_for_tasks_and_its_uuid_is_the_credential: "Un espacio es un contenedor de tareas, y su UUID es la credencial. Quien tenga el enlace puede leerlo y escribirlo; compartir es dar el enlace a alguien. No hay nada que registrar, nada donde entrar y ninguna contraseña que perder, lo que también significa que el enlace es la única vía de vuelta a un espacio, así que conviene guardarlo como un token de API."
  progress_is_not_stored: "El progreso no se almacena"
  current_state_lives_in_memory_and_expires_on_its_own: "El estado actual vive en memoria y caduca solo. Un rastreador que reporta cada segundo durante tres meses no hace crecer ninguna base de datos, y no queda nada que limpiar después. El trato es deliberado: no hay historial ni gráficas, solo lo que está pasando ahora."
  what_it_will_not_do: "Lo que no va a hacer"
  send_commands_back: "Devolver órdenes."
  it_is_a_departures_board_not_an_orchestrator: "Es un panel de salidas, no un orquestador. Un proceso reporta; nada le reporta a él."
  keep_a_log: "Guardar un registro."
  one_line_the_latest_per_task: "Una línea, la última, por tarea. Almacenar registros es un problema resuelto y esto no es la solución."
  nest_more_than_one_level: "Anidar más de un nivel."
  a_task_may_have_steps_a_step_may_not: "Una tarea puede tener pasos; un paso no."
  run_it_yourself: "Ejecútalo tú"
  the_docker_snippet: "el fragmento de Docker"
  self_hosting_lowercase: "alojarlo tú mismo"
  the_server_is_open_source_and_self_hosting_is_one_container_html: "El servidor es de código abierto y alojarlo tú es un contenedor más un Redis: mira %{docker} para arrancarlo y %{self_hosting} para llevarlo como es debido. El servicio alojado existe para que no tengas que hacerlo, no porque el software esté capado sin él."
  nothing_to_sign_up_for: "Nada que registrar"
  make_a_space_keep_its_link_and_start_reporting_into_it: "Crea un espacio, guarda su enlace y empieza a reportar en él desde cualquier cosa."
  create_a_space: "Crear un espacio"
  watch_any_script_crawler_ci_job_or_agent: "Vigila cualquier script, rastreador, trabajo de CI o agente. Reporta su progreso con una sola petición HTTP; tú lo miras desde donde estés y recibes un aviso cuando termina. Código abierto, alojable por ti."
  the_server_is_open_source_under_the_agpl: "El servidor es de código abierto bajo la AGPL, y el servicio alojado ejecuta la misma imagen que ejecutarías tú. Alojarlo tú mismo cuesta un contenedor y un Redis, y la base de datos se mantiene pequeña para siempre porque el progreso nunca se escribe en ella."
  one_file: "Un solo archivo"
  the_docker_page: "la página de Docker"
  docker_compose_yml_is_the_whole_install_html: "%{file} es toda la instalación. Ejecuta la imagen publicada, así que no hay nada que clonar ni nada que compilar: cópialo de %{docker}, que imprime el archivo actual, sustituye el secreto de ejemplo por %{generate} y arráncalo:"
  that_is_the_whole_setup_the_app_on_localhost_html: "Eso es toda la instalación: la aplicación en %{url}, un Redis y un archivo SQLite en un volumen con nombre. Ábrela, crea un espacio, y el menú Conectar de ese espacio te da los comandos con su UUID ya puesto."
  configuring_it: "Configurarlo"
  the_file_is_yours_from_the_moment_you_save_it_html: "El archivo es tuyo desde el momento en que lo guardas, y es el único sitio donde se configura nada: cada ajuste es una línea de un bloque %{environment}, así que añadir uno es añadir una línea:"
  environment_variables_is_the_full_list_html: "%{link} es la lista completa, y todo lo que hay en ella funciona aquí. Para publicarlo en un puerto distinto del 7979, cambia el lado izquierdo de %{ports}: la aplicación dentro del contenedor siempre está en el 3000."
  what_is_running: "Qué está corriendo"
  two_processes_and_a_file_the_app_answers_requests: "Dos procesos y un archivo. La aplicación responde a las peticiones y ejecuta el worker dentro de sí misma — Sidekiq va embebido en Puma, así que a una notificación no le puede faltar un servicio propio. Redis guarda el progreso actual de cada tarea y la cola de trabajos; SQLite guarda los espacios y la forma de cada tarea."
  updating_it: "Actualizarlo"
  name_the_service_a_bare_pull_takes_redis_with_it_html: "Nombra el servicio. Un %{pull} a secas también descarga Redis, y si se ha publicado un %{redis} más reciente, %{up} reemplaza también ese contenedor — y tira el progreso de todo lo que esté corriendo."
  replacing_only_the_app_container_leaves_every_running_task_where_it_was_html: "Reemplazar solo el contenedor de la aplicación deja cada tarea en curso justo donde estaba, porque el progreso vive en Redis y a Redis no se le tocó. Los títulos y la estructura están en el volumen y sobreviven de todos modos. Nada sobrevive a %{down} ni a un reinicio del host: Redis no guarda nada en disco, a propósito."
  why_7979: "Por qué el 7979"
  not_3000_this_is_a_service_you_leave_running_for_weeks_html: "No el 3000. Este es un servicio que dejas corriendo durante semanas mientras trabajas, y el 3000 es donde aterrizan tus propios servidores de desarrollo: Rails, Vite, Next, Grafana y la mitad de las líneas %{run} de otras guías. Un servicio en segundo plano no debería ocupar el puerto más disputado de la máquina, y menos aún uno cuya URL pegas en un secreto de CI y luego olvidas."
  inside_the_container_it_is_still_3000_html: "Dentro del contenedor sigue siendo el 3000; solo se movió el puerto publicado, y eso es la línea %{ports}."
  losing_the_volume_is_recoverable: "Perder el volumen es recuperable"
  spaces_and_task_structure_are_on_it_and_nothing_else: "En él están los espacios y la estructura de las tareas, y nada más. Si desaparece, creas un espacio nuevo y tus procesos lo repueblan todo en su siguiente petición. Haz copia de seguridad si prefieres no repartir un UUID de espacio nuevo a todo lo que reporta ahí, pero no hay nada en él que no se pueda reconstruir ejecutando los trabajos otra vez."
  sqlite_or_postgresql: "SQLite o PostgreSQL"
  both_from_the_same_image_and_the_same_migrations_html: "Los dos, desde la misma imagen y las mismas migraciones, elegido con %{database_url}. SQLite es lo predeterminado y es la respuesta correcta para una sola máquina: dos tablas, búsquedas por clave primaria, casi nunca escrituras. Apunta a %{postgres} cuando ejecutes varios contenedores de la aplicación, porque no pueden compartir un archivo."
  behind_a_proxy: "Detrás de un proxy"
  set_force_ssl_true_once_something_in_front_terminates_tls_html: "Pon %{force_ssl} en cuanto algo delante de la aplicación termine el TLS. Está desactivado por defecto para que una instalación a la que se llega por HTTP simple no te redirija a un certificado que no tienes."
  notifications_lowercase: "notificaciones"
  set_a_vapid_key_pair_and_a_notify_me_button_appears_html: "Pon un par de claves VAPID y aparecerá un botón «%{notify}» en cada espacio; deja las claves sin poner y la función no existe. No hay nada que registrar con Apple ni con Google. Mira %{link} para la historia completa, incluido lo que tiene que pasar en un teléfono."
  sweeping_empty_spaces: "Barrer los espacios vacíos"
  ever: "alguna vez"
  opening_the_site_creates_a_space_for_you_html: "Abrir el sitio crea un espacio para ti, así que se crean muchos que nunca se usan, incluidos los de cualquier cosa que rastree la página. Un espacio que %{ever} haya tenido una tarea se conserva para siempre, por mucho que nadie lo mire. Solo se barren los que nunca tuvieron ni una tarea, y solo cuando tienen más de 30 días."
  nothing_runs_it_for_you_schedule_it_however_you_already_schedule_things: "Nada lo ejecuta por ti. Prográmalo como ya programes las cosas:"
  crontab_daily_at_0417: "crontab, a diario a las 04:17"
  because_nothing_is_on_a_timer_30_days_is_a_floor: "Como nada corre con temporizador, 30 días es un mínimo y no un calendario: ejecútalo a diario y los espacios vacíos se van el día en que califican; ejecútalo una vez al año y se quedan hasta entonces. Saltárselo no pone en riesgo tus datos — el barrido solo toca filas que nunca se usaron — simplemente significa que la tabla crece con espacios que nadie abrió jamás."
  your_instance_is_not_indexable: "Tu instancia no es indexable"
  every_page_of_a_self_hosted_install_is_noindex_html: "Toda página de una instalación propia es %{noindex}, %{robots} lo prohíbe todo y %{sitemap} responde 404. Desde la máquina de alguien no hay público al que llegar ni nada allí que quiera encontrarse en una búsqueda, y no hay que configurar nada para ello: es lo que hay."
  the_point_of_the_whole_product_is_the_moment_a_job_finishes: "El sentido de todo el producto es el momento en que un trabajo termina mientras tú estás en otra parte. Progress Watch lo entrega mediante Web Push, directo del servidor a tu navegador: escritorio y teléfono por un mismo mecanismo, sin nada por medio que sea nuestro."
  turning_it_on: "Activarlo"
  push_is_opt_in_per_space_open_a_space_press_html: "Push es opcional y por espacio. Abre un espacio, pulsa %{notify}, y ese navegador queda registrado para ese espacio y para ningún otro. No se guarda nada sobre ti hasta que lo pulsas, y quitar el espacio lo da de baja de nuevo."
  on_a_phone_install_the_site_first: "En un teléfono, instala primero el sitio"
  add_to_home_screen: "Añadir a pantalla de inicio"
  ios_delivers_web_push_only_to_a_site_added_to_the_home_screen_html: "iOS entrega Web Push solo a un sitio añadido a la pantalla de inicio, y no hay forma de evitarlo: abre el espacio en Safari, Compartir, %{add}, y pulsa Avisarme desde ahí. Android y escritorio funcionan desde una pestaña normal."
  installing_has_a_second_benefit_on_ios: "Instalarlo tiene una segunda ventaja en iOS. Safari borra el almacenamiento local de un sitio normal a los siete días sin visitas, y una aplicación web instalada queda exenta, y en ese almacenamiento vive tu lista de espacios. No hay ninguna cuenta desde la que restaurarla."
  a_tree_of_steps_is_one_notification: "Un árbol de pasos es una notificación"
  every_task_that_finishes_notifies_including_each_step_of_a_job: "Toda tarea que termina avisa, incluido cada paso de un trabajo. No se apilan: un paso reemplaza en su sitio la notificación anterior de su trabajo en lugar de sumarse a ella, así que un despliegue de diez pasos se lee como una línea que va cambiando, y solo la finalización del trabajo en sí vuelve a vibrar."
  what_each_party_learns: "Qué aprende cada parte"
  payloads_are_encrypted_for_the_browser_that_subscribed: "Las cargas van cifradas para el navegador que se suscribió, con claves que solo él tiene. Google, Mozilla y Apple retransmiten texto cifrado y no pueden leer los títulos de tus tareas. Lo que sí saben es que un navegador concreto recibió algo, y cuándo."
  your_own_server_learns_one_thing_it_otherwise_would_not: "Tu propio servidor aprende una cosa que de otro modo no sabría: que un navegador se suscribió a un espacio dado. Esa es la razón de que sea un botón por espacio y no un ajuste global: la lista de espacios que tiene un navegador vive en ese navegador y en ningún otro sitio, y una suscripción es lo único que mete un espacio en los registros del servidor."
  if_you_are_self_hosting_push_content_minimal_html: "Si te lo alojas tú, %{minimal} envía «Task completed» sin título. La carga va cifrada de todos modos; esto es para la pantalla de bloqueo de un teléfono que otro puede ver."
  self_hosting_it_has_to_be_https: "Alojarlo tú: tiene que ser HTTPS"
  a_browser_hands_out_a_service_worker_only_on_a_secure_origin_html: "Un navegador solo entrega un service worker en un origen seguro, y Web Push necesita uno. En %{address} el botón no aparece siquiera, digan lo que digan tus claves, y nada explica por qué, porque para la página la función no existe en ese navegador. %{localhost} es la única excepción, que es justo por lo que esto funciona mientras lo pruebas y deja de hacerlo en cuanto lo pasas a una máquina de la red."
  so_notifications_mean_a_certificate_html: "Así que notificaciones significa certificado: algo delante que termine el TLS — Caddy, Traefik, nginx, un túnel de Cloudflare — y %{force_ssl} puesto una vez esté."
  self_hosting_generating_the_keys: "Alojarlo tú: generar las claves"
  both_keys_unset_means_the_feature_does_not_exist_generate_a_pair_once: "Las dos claves sin poner significa que la función no existe: ni botón, ni nada guardado sobre nadie. Genera un par una vez:"
  put_both_into_the_environment_block_and_run_up_again_html: "Pon las dos en el bloque %{environment} de docker-compose.yml y haz %{up} otra vez. No %{restart}, que reutiliza la configuración que el contenedor ya tiene."
  there_is_nothing_to_register_anywhere_lead: "No hay nada que registrar en ninguna parte"
  there_is_nothing_to_register_anywhere_html: "%{nothing}: ni proyecto de Firebase, ni cuenta de desarrollador de Apple, ni clave de API. Quien hizo el navegador opera el servicio de push; su dirección llega dentro de la suscripción que el navegador le entrega a tu servidor, y el par VAPID es la prueba autofirmada de que cada notificación vino del mismo emisor. %{subject} es solo una dirección de contacto y nadie la verifica."
  do_not_rotate_the_keys_existing_subscriptions_are_bound_to_them: "No rotes las claves. Las suscripciones existentes están atadas a ellas, a los navegadores no se les avisa, y sencillamente dejan de recibir."
  why_there_is_no_mobile_app: "Por qué no hay aplicación móvil"
  a_react_native_app_was_designed_for_this_and_has_not_been_built: "Se diseñó una aplicación en React Native para esto y no se ha construido, porque Web Push cubre aquello para lo que era. Lo único que seguiría haciendo mejor es vigilar varios servidores a la vez: un navegador está atado a un origen, así que un espacio de otro servidor se abre en ese servidor en lugar de unirse a una sola lista. Si vigilas un espacio alojado y otro propio, instala el sitio desde cada uno."
  everything_is_an_environment_variable: "Todo es una variable de entorno. No hay archivos de configuración que editar ni credenciales cifradas metidas en la imagen, así que el mismo contenedor corre en un NAS de casa y en la nube."
  general: "General"
  variable: "Variable"
  default: "Por defecto"
  what_it_does: "Qué hace"
  the_only_variable_that_is_required_in_production_html: "La única variable obligatoria en producción. Genera una con %{generate} y consérvala."
  where_spaces_and_task_structure_live_html: "Dónde viven los espacios y la estructura de las tareas. El archivo por defecto es lo que guarda el volumen de Docker; apúntala a %{postgres} para un despliegue en la nube. El progreso en sí nunca se escribe aquí."
  set_true_when_something_in_front_terminates_tls_html: "Ponla a %{value} cuando algo delante termine el TLS. También controla %{assume}, así que dejarla apagada mantiene la aplicación usable por HTTP simple en vez de redirigir a un certificado que no tienes."
  the_port_puma_binds_inside_the_container_html: "El puerto al que Puma se enlaza dentro del contenedor. %{compose} lo publica en el 7979, porque un servicio que dejas corriendo durante semanas no debería ocupar el puerto que quieren tus propios servidores de desarrollo."
  logs_go_to_stdout_and_nowhere_else_this_is_how_much_of_them: "Los logs van a stdout y a ningún otro sitio. Esto es cuánto de ellos."
  how_many_spaces_and_tasks_one_address_may_create_per_hour: "Cuántos espacios y tareas puede crear una dirección por hora. Sin poner significa sin límite, que es la respuesta correcta para un servidor al que solo llegas tú. Reportar progreso nunca se limita."
  behind_a_proxy_the_limit_is_only_as_good_as_the_address_html: "Detrás de un proxy, %{limit} vale tanto como la dirección que ve la aplicación. Rails lee %{forwarded} y se fía de él desde rangos privados, que es lo que envía un proxy inverso en el mismo host; pero si la cabecera no llega, cada petición parece un solo cliente y el límite deja fuera a todos a la vez en lugar de a nadie."
  redis_holds_two_unrelated_things: "Redis guarda dos cosas sin relación: el progreso actual de cada tarea y la cola de Sidekiq. Por defecto son dos bases de datos lógicas de un mismo servidor, y cualquiera de las dos puede moverse a su propia instancia."
  the_server_used_for_both_roles_split_into_db_0_and_db_1: "El servidor usado para ambos papeles, repartido en db 0 para el progreso y db 1 para la cola."
  overrides_the_progress_store_alone: "Sustituye solo el almacén de progreso."
  overrides_the_queue_alone: "Sustituye solo la cola."
  how_long_a_task_keeps_its_progress_without_being_written_to: "Cuánto conserva una tarea su progreso sin que se escriba en ella. Cada reporte lo refresca, así que esto es en realidad cuánto tiempo sigue en pantalla una tarea abandonada."
  key_prefix_for_the_progress_store: "Prefijo de clave del almacén de progreso, para que pueda compartir base de datos con otra cosa."
  both_keys_unset_means_the_feature_does_not_exist_no_button_on_a_space: "Las dos claves sin poner significa que la función no existe: ni botón en un espacio, ni nada guardado sobre nadie. No hay nada que registrar con Apple ni con Google: quien hizo el navegador opera el servicio de push. Genera un par una vez y no lo rotes; las suscripciones existentes están atadas a él y a los navegadores no se les avisa."
  public_half_of_the_pair_that_signs_every_push: "La mitad pública del par que firma cada push. Se le entrega al navegador cuando se suscribe."
  private_half_never_leaves_the_server: "La mitad privada. No sale nunca del servidor."
  a_contact_address_the_push_services_can_reach: "Una dirección de contacto a la que los servicios de push pueden acudir si algo va mal. Nadie la verifica."
  full_puts_the_task_title_in_the_notification_html: "%{full} pone el título de la tarea en la notificación, %{minimal} envía «Task completed» y nada identificativo."
  process_sizing: "Dimensionar los procesos"
  puma_threads_per_process_and_the_size_of_both_pools: "Hilos de Puma por proceso, y el tamaño tanto del pool de conexiones a la base de datos como del de Redis."
  puma_worker_processes_zero_runs_a_single_process: "Procesos worker de Puma. Cero ejecuta un solo proceso, que es la respuesta correcta en una máquina pequeña."
  threads_in_the_sidekiq_process: "Hilos del proceso Sidekiq. Enviar notificaciones es el único trabajo que hay."
  sidekiq_runs_inside_puma_set_false_to_run_it_as_its_own_process: "Sidekiq se ejecuta dentro de Puma. Ponlo en `false` donde haya un proceso worker dedicado."
