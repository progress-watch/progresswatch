  agent_skill: "Agent skill"
  give_an_ai_agent_a_progress_skill: "Give an AI agent a progress skill"
  give_an_ai_agent_a_skill_for_reporting_its_own_progress: "Give an AI agent a skill for reporting its own progress into Progress Watch."
  the_skill_drives_the_cli_so_the_agent_needs_no_server_or_uuid_of_its_own: "The skill drives the CLI, so the agent needs no server or uuid of its own — it uses whatever this machine is already configured for."
  install_the_cli_the_skill_is_a_set_of_instructions_for_driving_it: "Install the CLI. The skill is a set of instructions for driving it."
  point_it_at_this_server_saved_to_progresswatchrc: "Point it at this server. Saved to ~/.progresswatchrc, so this is a one-off."
  create_a_space_for_the_agent_to_report_into: "Create a space for the agent to report into."
  point_it_at_this_space_use_local_to_bind_it_to_one_project: "Point it at this space. Use --local to bind it to one project instead."
  install_the_skill_it_knows_75_agents: "Install the skill. It knows 75+ agents and asks which to install for."
  that_is_all_the_agent_decides_on_its_own_when_work_is_worth_tracking: "That is all — the agent decides on its own when work is worth tracking, creates a task for the job and a child task per step, and closes each one as it finishes. If you would rather not run somebody else's installer, the same file is skills/progresswatch-cli/SKILL.md in that repository, and it goes in .claude/skills/."
  mcp: "MCP"
  connect_an_agent_over_mcp: "Connect an agent over MCP"
  connect_an_ai_agent_to_progress_watch_over_mcp: "Connect an AI agent to Progress Watch over MCP."
  add_the_server: "Add the server."
  or_write_it_into_mcp_json_yourself: "Or write it into .mcp.json yourself."
  the_space_uuid_sits_in_the_url_so_any_client_that_takes_only_a_url_works: "The space uuid sits in the URL, so any client that takes only a URL works. To keep it out of the path, send it as a header instead."
  four_tools_create_space_create_task_update_task_complete_task: "Four tools: create_space, create_task, update_task, complete_task. The agent decides on its own when to create a task and how often to report. One connected without a space can call create_space and hand you back the URL, so it is never stuck with nowhere to report."
  curl: "curl"
  try_the_api_with_curl: "Try the API with curl"
  try_the_api_with_curl_and_report_from_a_client_that_can_only_fire_a_url: "Try the Progress Watch API with curl, and report from a client that can only fire a URL."
  create_a_space_keep_its_uuid_whoever_has_it_can_read_and_write_here: "Create a space, keep its uuid. Whoever has it can read and write here."
  create_a_task_keep_its_uuid: "Create a task, keep its uuid."
  report_progress_every_write_replaces_the_whole_state: "Report progress. Every write replaces the whole state — send all of it each time."
  finish_it_this_is_what_sends_the_notification: "Finish it. This is what sends the notification."
  that_is_the_whole_surface_and_it_is_what_the_cli_and_the_mcp_tools_call: "That is the whole surface, and it is what the CLI and the MCP tools call. For something you run every day the CLI is one line instead of four; to build on it, the API reference and OpenAPI 3.1 are at /openapi.json."
  one_more_for_a_client_that_cannot_do_the_above: "One more, for a client that cannot do the above. Some things can only be handed a URL — an uptime pinger, a webhook field in somebody else's product, a router or a sensor, a cron line with a bare curl. They cannot choose a method or send a body, so the same write is reachable as a plain GET."
  the_g_is_for_curl_not_for_us: "The -g is for curl, not for us: curl reads square brackets in a URL as a range and refuses the address without it. Anything that simply fires a URL needs nothing special."
  use_it_only_when_there_is_no_alternative_it_is_a_get_that_writes: "Use it only when there is no alternative. It is a GET that writes, so anything that follows the URL performs the write: paste it into a chat and the link preview reports for you. If your client can send a request body at all, the PUT above is the one to use."
  docker: "Docker"
  self_host_progress_watch_with_docker: "Self-host Progress Watch with Docker"
  the_docker_compose_file_for_running_your_own_server: "The Docker Compose file for running your own Progress Watch server."
  your_own_server_on_your_own_box: "Your own server, on your own box. Nothing here talks to progress.watch."
  save_this_as_docker_compose_yml_it_runs_the_published_image: "Save this as docker-compose.yml. It runs the published image, so there is nothing to clone and nothing to build — and it is yours to edit from here on."
  start_it_the_app_a_redis_and_a_sqlite_file: "Start it. The app, a Redis, and a SQLite file on a volume."
  then_point_the_cli_at_it_this_page_is_served_from_server: "Then point the CLI at it. This page is served from {{server}}."
  that_is_a_working_server_notifications_postgres_and_the_one_click_deploy: "That is a working server. Notifications, Postgres, the one thing worth putting on a cron and the one-click deploy are all in Self-hosting in the sidebar."
  an_introduction_to_progress_watch_an_open_source_progress_tracker: "An introduction to Progress Watch, an open source progress tracker for anything that runs without you."
  watch_any_process: "Watch any process"
  some_things_run_for_hours_with_nobody_watching: "Some things run for hours with nobody watching: a nightly crawl, a training run, a migration, a CI pipeline, an agent working through a long task. Progress Watch gives them one place to report to, and gives you one place to look — plus a notification when they finish."
  three_commands_from_inside_the_work: "Three commands from inside the work"
  create_a_task_where_the_job_starts_report_against_it_as_it_moves: "Create a task where the job starts, report against it as it moves, close it when it is done. The middle one is the call that goes in your loop, and it is the only thing that knows the numbers."
  counts_not_percentages_the_screen_shows_html: "Counts, not percentages: the screen shows %{counts}, which tells you something that %{percent} does not. The total may change as a job discovers more work — send the new number and the bar recalculates. The %{cli} page has all three, ready to paste."
  when_the_process_is_not_yours_to_change_html: "When the process is not yours to change, %{run} wraps it whole — it creates the task, passes the output through untouched and closes it with the exit code, so a job that fails still notifies you. It reports start and finish rather than counts, because nothing outside a process knows how far along it is."
  or_one_request_from_anything: "Or one request, from anything"
  underneath_all_of_it_is_a_single_http_request_html: "Underneath all of it is a single HTTP request, and that is the whole API. There is no SDK to install and nothing to import, because wrapping one %{put} would add nothing you could not write yourself in less time than reading its documentation."
  api_reference: "API reference"
  the_api_reference_is_the_reference_to_build_against_html: "The %{api} is the reference to build against, and pasting the %{curl} examples is the fastest way to see the thing work before you commit to it."
  agents_report_their_own_work: "Agents report their own work"
  agent_skill_lowercase: "agent skill"
  an_ai_agent_breaks_a_job_into_steps_html: "An AI agent breaks a job into steps and then works for a long time with nothing to show for it. Connect one over %{mcp} and it gets tools for creating a task and reporting against it: one task for the job, one child task per step, updated as it goes. MCP needs nothing installed anywhere; for a client that does not speak it, an %{skill} teaches the same thing through the CLI."
  the_agent_decides_when_tracking_is_worth_it_and_how_often_to_report: "The agent decides when tracking is worth it and how often to report. The tool descriptions tell it what a task is for, not a schedule to follow."
  no_accounts: "No accounts"
  a_space_is_a_container_for_tasks_and_its_uuid_is_the_credential: "A space is a container for tasks, and its UUID is the credential. Whoever has the link can read and write it; sharing is giving someone the link. There is nothing to sign up for, nothing to log into, and no password to lose — which also means the link is the only way back to a space, so it is worth keeping like an API token."
  progress_is_not_stored: "Progress is not stored"
  current_state_lives_in_memory_and_expires_on_its_own: "Current state lives in memory and expires on its own. A crawler reporting every second for three months does not grow a database, and there is nothing to clean up afterwards. The trade is deliberate: there is no history and no charts, only what is happening now."
  what_it_will_not_do: "What it will not do"
  send_commands_back: "Send commands back."
  it_is_a_departures_board_not_an_orchestrator: "It is a departures board, not an orchestrator. A process reports; nothing reports to it."
  keep_a_log: "Keep a log."
  one_line_the_latest_per_task: "One line, the latest, per task. Log storage is a solved problem and this is not it."
  nest_more_than_one_level: "Nest more than one level."
  a_task_may_have_steps_a_step_may_not: "A task may have steps; a step may not."
  run_it_yourself: "Run it yourself"
  the_docker_snippet: "the Docker snippet"
  self_hosting_lowercase: "self-hosting"
  the_server_is_open_source_and_self_hosting_is_one_container_html: "The server is open source and self-hosting is one container: see %{docker} to start it and %{self_hosting} for running it properly. The hosted service exists so you do not have to, not because the software is crippled without it."
  nothing_to_sign_up_for: "Nothing to sign up for"
  make_a_space_keep_its_link_and_start_reporting_into_it: "Make a space, keep its link, and start reporting into it from anything."
  create_a_space: "Create a space"
  watch_any_script_crawler_ci_job_or_agent: "Watch any script, crawler, CI job or agent. It reports progress with a single HTTP request; you watch it from anywhere and get a push notification when it finishes. Open source, self-hostable."
  the_server_is_open_source_under_the_agpl: "The server is open source under the AGPL, and the hosted service runs the same image you would. Self-hosting costs one container and one volume, and the database stays small forever because progress is never written to it."
  one_file: "One file"
  the_docker_page: "the Docker page"
  docker_compose_yml_is_the_whole_install_html: "%{file} is the whole install. It runs the published image, so there is nothing to clone and nothing to build. Copy it from %{docker}, which prints the current file, and start it:"
  that_is_the_whole_setup_the_app_on_localhost_html: "That is the whole setup: the app on %{url}, with Redis and SQLite inside the same container and everything they keep on the named volume. Open it, create a space, and the Connect menu on that space hands you snippets with its UUID already filled in."
  configuring_it: "Configuring it"
  the_file_is_yours_from_the_moment_you_save_it_html: "The file is yours from the moment you save it, and it is the only place anything is configured. Every setting is a line in an %{environment} block under the service, which the file leaves out until you need one:"
  environment_variables_is_the_full_list_html: "%{link} is the full list, and everything on it works here. To publish somewhere other than 7979, change the left-hand side of %{ports} — the app inside the container is always on 3000."
  what_is_running: "What is running"
  two_processes_and_a_file_the_app_answers_requests: "Two processes and a file, all in one container. The app answers requests and runs the worker inside itself, since Sidekiq is embedded in Puma, and it starts Redis beside itself and stops it on the way out. Redis holds the current progress of every task and the job queue, and snapshots both to the volume; SQLite holds spaces and the shape of each task. Set REDIS_URL and the app uses that Redis instead and starts none of its own."
  updating_it: "Updating it"
  pull_the_new_image_and_start_it_again: "Pull the new image and start it again:"
  every_running_task_stays_where_it_was: "Every running task stays where it was. Stopping the container makes Redis write a snapshot to the volume, and the new container loads it as it starts. Only a crash or a power cut skips that write, and then what comes back is the last periodic snapshot, minutes old when reports are frequent and up to an hour old when they are not: a task reads \"Waiting for data…\" or an older number until its next report."
  why_7979: "Why 7979"
  not_3000_this_is_a_service_you_leave_running_for_weeks_html: "Not 3000. This is a service you leave running for weeks while you work, and 3000 is where your own dev servers land — Rails, Vite, Next, Grafana and half the %{run} lines in other guides. A background service should not hold the most contended port on the machine, least of all one whose URL you paste into a CI secret and then forget about."
  inside_the_container_it_is_still_3000_html: "Inside the container it is still 3000; only the published port moved, and that is the %{ports} line."
  losing_the_volume_is_recoverable: "Losing the volume is recoverable"
  spaces_task_structure_a_snapshot_of_redis_and_the_secret_key_are_on_it: "Spaces, task structure, a snapshot of Redis and the secret key are on it. If it goes, you create a new space and your reporting processes repopulate everything on their next request, and a new secret key costs nothing, because there are no accounts to sign anyone out of. Back it up if you would rather not redistribute a new space UUID to whatever reports into it, but there is nothing on it that cannot be rebuilt by running the jobs again."
  sqlite_or_postgresql: "SQLite or PostgreSQL"
  both_from_the_same_image_and_the_same_migrations_html: "Both, from the same image and the same migrations, chosen by %{database_url}. SQLite is the default and is the right answer for one box: two tables, primary-key lookups, almost never written. Point it at %{postgres} when you are running several app containers, because they cannot share a file."
  behind_a_proxy: "Behind a proxy"
  set_force_ssl_true_once_something_in_front_terminates_tls_html: "Set %{force_ssl} once something in front of the app terminates TLS. It is off by default so that an install reached over plain HTTP does not redirect you to a certificate you do not have."
  notifications_lowercase: "notifications"
  set_a_vapid_key_pair_and_a_notify_me_button_appears_html: "Set a VAPID key pair and a \"%{notify}\" button appears on every space; leave the keys unset and the feature does not exist. There is nothing to register with Apple or Google. See %{link} for the whole story, including what has to happen on a phone."
  sweeping_empty_spaces: "Sweeping empty spaces"
  ever: "ever"
  opening_the_site_creates_a_space_for_you_html: "Opening the site creates a space for you, so plenty get created and never used — including by anything that crawls the page. A space that has %{ever} held a task is kept for good, however long nobody looks at it. Only ones that never held a single task are swept, and only once they are more than 30 days old."
  nothing_runs_it_for_you_schedule_it_however_you_already_schedule_things: "Nothing runs it for you. Schedule it however you already schedule things:"
  crontab_daily_at_0417: "crontab, daily at 04:17"
  because_nothing_is_on_a_timer_30_days_is_a_floor: "Because nothing is on a timer, 30 days is a floor rather than a schedule: run it daily and empty spaces go the day they qualify, run it once a year and they sit until then. Skipping it is safe for your data — the sweep only ever takes rows that were never used — it just means the table grows with spaces nobody ever opened."
  your_instance_is_not_indexable: "Your instance is not indexable"
  every_page_of_a_self_hosted_install_is_noindex_html: "Every page of a self-hosted install is %{noindex}, %{robots} disallows everything, and %{sitemap} answers 404. There is no audience to reach from somebody's own box and nothing there that wants to be found in a search, and nothing has to be configured for it — it is what you get."
  the_point_of_the_whole_product_is_the_moment_a_job_finishes: "The point of the whole product is the moment a job finishes while you are somewhere else. Progress Watch delivers that through Web Push, straight from the server to your browser — desktop and phone through one mechanism, with nothing in between that belongs to us."
  turning_it_on: "Turning it on"
  push_is_opt_in_per_space_open_a_space_press_html: "Push is opt-in per space. Open a space, press %{notify}, and that browser is registered for that space and no other. Nothing about you is stored until you press it, and forgetting the space unregisters it again."
  on_a_phone_install_the_site_first: "On a phone, install the site first"
  add_to_home_screen: "Add to Home Screen"
  ios_delivers_web_push_only_to_a_site_added_to_the_home_screen_html: "iOS delivers Web Push only to a site added to the Home Screen, and there is no way around it: open the space in Safari, Share, %{add}, and press Notify me from there. Android and desktop work from an ordinary tab."
  installing_has_a_second_benefit_on_ios: "Installing has a second benefit on iOS. Safari clears an ordinary site's local storage after seven days without a visit, and an installed web app is exempt — and that storage is where your list of spaces lives. There is no account to restore it from."
  a_tree_of_steps_is_one_notification: "A tree of steps is one notification"
  every_task_that_finishes_notifies_including_each_step_of_a_job: "Every task that finishes notifies, including each step of a job. They do not stack: a step replaces its job's previous notification in place rather than adding to it, so a ten-step deploy reads as one line that keeps changing, and only the job's own completion buzzes again."
  what_each_party_learns: "What each party learns"
  payloads_are_encrypted_for_the_browser_that_subscribed: "Payloads are encrypted for the browser that subscribed, with keys only it holds. Google, Mozilla and Apple relay ciphertext and cannot read your task titles. What they do learn is that a particular browser received something, and when."
  your_own_server_learns_one_thing_it_otherwise_would_not: "Your own server learns one thing it otherwise would not: that a browser opted in on a given space. That is the reason it is a button per space rather than a global setting — the list of spaces a browser holds lives in that browser and nowhere else, and a subscription is the one thing that puts a space in the server's records."
  if_you_are_self_hosting_push_content_minimal_html: "If you are self-hosting, %{minimal} sends \"Task completed\" with no title. The payload is encrypted either way; this is for the lock screen of a phone somebody else can see."
  self_hosting_it_has_to_be_https: "Self-hosting: it has to be HTTPS"
  a_browser_hands_out_a_service_worker_only_on_a_secure_origin_html: "A browser hands out a service worker only on a secure origin, and Web Push needs one. On %{address} the button does not appear at all, whatever your keys say — and nothing explains why, because as far as the page is concerned the feature does not exist on that browser. %{localhost} is the one exception, which is exactly why this works while you are trying it out and stops the moment you move it to a box on the network."
  so_notifications_mean_a_certificate_html: "So notifications mean a certificate: something in front that terminates TLS — Caddy, Traefik, nginx, a Cloudflare tunnel — and %{force_ssl} set once it is there."
  self_hosting_generating_the_keys: "Self-hosting: generating the keys"
  both_keys_unset_means_the_feature_does_not_exist_generate_a_pair_once: "Both keys unset means the feature does not exist — no button, and nothing stored about anyone. Generate a pair once:"
  put_both_into_the_environment_block_and_run_up_again_html: "Put both into the %{environment} block in docker-compose.yml and %{up} again. Not %{restart}, which reuses the configuration the container already has."
  there_is_nothing_to_register_anywhere_lead: "There is nothing to register anywhere"
  there_is_nothing_to_register_anywhere_html: "%{nothing} — no Firebase project, no Apple developer account, no API key. Whoever made the browser runs the push service; its address arrives inside the subscription the browser hands your server, and the VAPID pair is self-signed proof that every notification came from the same sender. %{subject} is only a contact address and nobody verifies it."
  do_not_rotate_the_keys_existing_subscriptions_are_bound_to_them: "Do not rotate the keys. Existing subscriptions are bound to them, browsers are not told, and they simply stop receiving."
  why_there_is_no_mobile_app: "Why there is no mobile app"
  a_react_native_app_was_designed_for_this_and_has_not_been_built: "A React Native app was designed for this and has not been built, because Web Push covers what it was for. The one thing it would still do better is watching several servers at once: a browser is bound to one origin, so a space on another server opens on that server rather than joining a single list. If you watch a hosted space and a self-hosted one, install the site from each."
  everything_is_an_environment_variable: "Everything is an environment variable. There are no config files to edit and no encrypted credentials baked into the image, so the same container runs on a home NAS and in the cloud."
  general: "General"
  variable: "Variable"
  default: "Default"
  what_it_does: "What it does"
  generated_on_first_start_and_kept_on_the_volume: "Generated on first start and kept on the volume, so leave it unset. Set it yourself where there is no volume, or where several containers have to share it."
  where_spaces_and_task_structure_live_html: "Where spaces and task structure live. The default file is what the Docker volume holds; point it at %{postgres} for a cloud deployment. Progress itself is never written here."
  set_true_when_something_in_front_terminates_tls_html: "Set %{value} when something in front terminates TLS. It also drives %{assume}, so leaving it off keeps the app usable over plain HTTP instead of redirecting to a certificate you do not have."
  the_port_puma_binds_inside_the_container_html: "The port Puma binds inside the container. %{compose} publishes it on 7979, because a service you leave running for weeks should not hold the port your own dev servers want."
  logs_go_to_stdout_and_nowhere_else_this_is_how_much_of_them: "Logs go to stdout and nowhere else. This is how much of them."
  how_many_spaces_and_tasks_one_address_may_create_per_hour: "How many spaces and tasks one address may create per hour. Unset means no limit, which is the right answer for a server only you can reach. Reporting progress is never limited."
  behind_a_proxy_the_limit_is_only_as_good_as_the_address_html: "Behind a proxy, %{limit} is only as good as the address the app sees. Rails reads %{forwarded} and trusts it from private ranges, which is what a reverse proxy on the same host sends — but if the header does not arrive, every request looks like one client and the limit locks out everybody at once rather than nobody."
  redis_holds_two_unrelated_things: "Redis holds two unrelated things: the current progress of every task, and the Sidekiq queue. They are two logical databases of one server by default, and either can be moved to its own instance."
  the_server_used_for_both_roles_split_into_db_0_and_db_1: "The server used for both roles, split into db 0 for progress and db 1 for the queue. Unset, the image runs its own Redis inside the container and snapshots it to the volume."
  overrides_the_progress_store_alone: "Overrides the progress store alone."
  overrides_the_queue_alone: "Overrides the queue alone."
  how_long_a_task_keeps_its_progress_without_being_written_to: "How long a task keeps its progress without being written to. Every report refreshes it, so this is really how long an abandoned task stays on screen."
  key_prefix_for_the_progress_store: "Key prefix for the progress store, so it can share a database with something else."
  both_keys_unset_means_the_feature_does_not_exist_no_button_on_a_space: "Both keys unset means the feature does not exist: no button on a space, and nothing stored about anyone. There is nothing to register with Apple or Google — whoever made the browser runs the push service. Generate a pair once and do not rotate it; existing subscriptions are bound to it and browsers are not told."
  public_half_of_the_pair_that_signs_every_push: "Public half of the pair that signs every push. Handed to the browser when it subscribes."
  private_half_never_leaves_the_server: "Private half. Never leaves the server."
  a_contact_address_the_push_services_can_reach: "A contact address the push services can reach if something goes wrong. Nobody verifies it."
  full_puts_the_task_title_in_the_notification_html: "%{full} puts the task title in the notification, %{minimal} sends \"Task completed\" and nothing identifying."
  process_sizing: "Process sizing"
  puma_threads_per_process_and_the_size_of_both_pools: "Puma threads per process, and the size of both the database and the Redis connection pool."
  puma_worker_processes_zero_runs_a_single_process: "Puma worker processes. Zero runs a single process, which is the right answer on a small box."
  threads_in_the_sidekiq_process: "Threads in the Sidekiq process. Sending notifications is the only job there is."
  sidekiq_runs_inside_puma_set_false_to_run_it_as_its_own_process: "Sidekiq runs inside Puma. Set it to `false` where a dedicated worker process runs."
