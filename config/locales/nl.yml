  the_skill_drives_the_cli_so_the_agent_needs_no_server_or_uuid_of_its_own: "De skill bedient de CLI, dus de agent heeft geen eigen server of uuid nodig — hij gebruikt waar deze machine al voor is ingesteld."
  install_the_cli_the_skill_is_a_set_of_instructions_for_driving_it: "Installeer de CLI. De skill is een set instructies om hem te bedienen."
