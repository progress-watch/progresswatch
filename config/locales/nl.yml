  point_it_at_this_space_use_local_to_bind_it_to_one_project: "Richt hem op deze ruimte. Gebruik --local om hem aan één project te binden."
  install_the_skill_it_knows_75_agents: "Installeer de skill. Hij kent 75+ agents en vraagt voor welke je wilt installeren."
  that_is_all_the_agent_decides_on_its_own_when_work_is_worth_tracking: "Dat is alles — de agent bepaalt zelf wanneer werk het volgen waard is, maakt een taak voor de klus en een deeltaak per stap, en sluit elke af zodra die klaar is. Wil je liever niet iemand anders' installer draaien: hetzelfde bestand is skills/progresswatch-cli/SKILL.md in dat repository, en het hoort in .claude/skills/."
