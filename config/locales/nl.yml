  four_tools_create_space_create_task_update_task_complete_task: "Vier tools: create_space, create_task, update_task, complete_task. De agent bepaalt zelf wanneer hij een taak aanmaakt en hoe vaak hij rapporteert. Een agent die zonder ruimte verbonden is kan create_space aanroepen en je de URL teruggeven, zodat hij nooit zonder plek zit om te rapporteren."
  curl: "curl"
  try_the_api_with_curl: "De API proberen met curl"
  try_the_api_with_curl_and_report_from_a_client_that_can_only_fire_a_url: "Probeer de Progress Watch-API met curl, en rapporteer vanuit een client die alleen een URL kan afvuren."
  create_a_space_keep_its_uuid_whoever_has_it_can_read_and_write_here: "Maak een ruimte aan, bewaar de uuid. Wie hem heeft kan hier lezen en schrijven."
  create_a_task_keep_its_uuid: "Maak een taak aan, bewaar de uuid."
  report_progress_every_write_replaces_the_whole_state: "Rapporteer voortgang. Elke schrijfactie vervangt de hele staat — stuur elke keer alles mee."
  finish_it_this_is_what_sends_the_notification: "Rond hem af. Dit is wat de melding stuurt."
  that_is_the_whole_surface_and_it_is_what_the_cli_and_the_mcp_tools_call: "Dat is het hele oppervlak, en het is wat de CLI en de MCP-tools aanroepen. Voor iets wat je dagelijks draait is de CLI één regel in plaats van vier; om erop te bouwen staan de API-referentie en OpenAPI 3.1 op /openapi.json."
  one_more_for_a_client_that_cannot_do_the_above: "Nog één, voor een client die het bovenstaande niet kan. Sommige dingen kun je alleen een URL geven — een uptime-pinger, een webhookveld in andermans product, een router of een sensor, een cron-regel met een kale curl. Ze kunnen geen methode kiezen en geen body sturen, dus dezelfde schrijfactie is ook bereikbaar als een gewone GET."
  the_g_is_for_curl_not_for_us: "De -g is voor curl, niet voor ons: curl leest vierkante haken in een URL als een reeks en weigert het adres zonder die vlag. Alles wat simpelweg een URL afvuurt heeft niets bijzonders nodig."
  use_it_only_when_there_is_no_alternative_it_is_a_get_that_writes: "Gebruik het alleen als er geen alternatief is. Het is een GET die schrijft, dus alles wat de URL volgt voert de schrijfactie uit: plak hem in een chat en de linkvoorbeeldweergave rapporteert voor je. Kan je client überhaupt een request-body sturen, dan is de PUT hierboven de juiste."
  docker: "Docker"
  self_host_progress_watch_with_docker: "Progress Watch zelf hosten met Docker"
  the_docker_compose_file_for_running_your_own_server: "Het Docker Compose-bestand om je eigen Progress Watch-server te draaien."
  your_own_server_on_your_own_box: "Je eigen server, op je eigen machine. Niets hiervan praat met progress.watch."
  save_this_as_docker_compose_yml_it_runs_the_published_image: "Sla dit op als docker-compose.yml. Het draait de gepubliceerde image, dus er valt niets te klonen en niets te bouwen — en vanaf hier is het van jou om aan te passen."
  start_it_the_app_a_redis_and_a_sqlite_file: "Start het. De app, een Redis en een SQLite-bestand op een volume."
  then_point_the_cli_at_it_this_page_is_served_from_server: "Richt daarna de CLI erop. Deze pagina wordt geserveerd vanaf {{server}}."
  that_is_a_working_server_notifications_postgres_and_the_one_click_deploy: "Dat is een werkende server. Meldingen, Postgres, het enige dat een cron waard is en de deploy met één klik staan allemaal onder Zelf hosten in de zijbalk."
  an_introduction_to_progress_watch_an_open_source_progress_tracker: "Een introductie tot Progress Watch, een open source voortgangsvolger voor alles wat draait zonder jou."
  watch_any_process: "Volg elk proces"
  some_things_run_for_hours_with_nobody_watching: "Sommige dingen draaien uren zonder dat iemand kijkt: een nachtelijke crawl, een trainingsrun, een migratie, een CI-pijplijn, een agent die zich door een lange taak werkt. Progress Watch geeft ze één plek om aan te rapporteren, en jou één plek om te kijken — plus een melding als ze klaar zijn."
  three_commands_from_inside_the_work: "Drie commando's vanuit het werk zelf"
  create_a_task_where_the_job_starts_report_against_it_as_it_moves: "Maak een taak aan waar de klus begint, rapporteer erop terwijl het vordert, sluit hem als het klaar is. Die in het midden is de aanroep die in je lus hoort, en het enige dat de getallen kent."
  counts_not_percentages_the_screen_shows_html: "Aantallen, geen percentages: het scherm toont %{counts}, wat je iets vertelt dat %{percent} niet vertelt. Het totaal mag veranderen als een klus meer werk ontdekt — stuur het nieuwe getal en de balk rekent opnieuw. De pagina %{cli} heeft ze alle drie, klaar om te plakken."
  when_the_process_is_not_yours_to_change_html: "Als het proces niet van jou is om aan te passen, wikkelt %{run} het in zijn geheel in — het maakt de taak aan, laat de uitvoer onaangeroerd door en sluit hem met de exitcode, zodat een klus die faalt je alsnog waarschuwt. Het rapporteert start en einde in plaats van aantallen, omdat niets buiten een proces weet hoe ver het is."
  or_one_request_from_anything: "Of één verzoek, vanuit wat dan ook"
  underneath_all_of_it_is_a_single_http_request_html: "Onder dit alles ligt één enkel HTTP-verzoek, en dat is de hele API. Er is geen SDK te installeren en niets te importeren, want het inpakken van één %{put} zou niets toevoegen dat je niet zelf sneller schrijft dan je de documentatie ervan leest."
  api_reference: "API-referentie"
  the_api_reference_is_the_reference_to_build_against_html: "De %{api} is de referentie om tegenaan te bouwen, en de %{curl}-voorbeelden plakken is de snelste manier om het ding te zien werken voordat je je eraan verbindt."
  agents_report_their_own_work: "Agents rapporteren hun eigen werk"
  agent_skill_lowercase: "agent-skill"
  an_ai_agent_breaks_a_job_into_steps_html: "Een AI-agent hakt een klus in stappen en werkt daarna lang door zonder iets te laten zien. Verbind er een via %{mcp} en hij krijgt tools om een taak aan te maken en erop te rapporteren: één taak voor de klus, één deeltaak per stap, onderweg bijgewerkt. MCP vereist nergens een installatie; voor een client die het niet spreekt leert een %{skill} hetzelfde via de CLI."
  the_agent_decides_when_tracking_is_worth_it_and_how_often_to_report: "De agent bepaalt wanneer volgen de moeite waard is en hoe vaak hij rapporteert. De toolbeschrijvingen vertellen hem waar een taak voor is, geen schema om aan te houden."
  no_accounts: "Geen accounts"
  a_space_is_a_container_for_tasks_and_its_uuid_is_the_credential: "Een ruimte is een houder voor taken, en de UUID ervan is de sleutel. Wie de link heeft kan lezen en schrijven; delen is iemand de link geven. Er valt niets aan te melden, nergens in te loggen en geen wachtwoord te verliezen — wat ook betekent dat de link de enige weg terug naar een ruimte is, dus bewaar hem als een API-token."
  progress_is_not_stored: "Voortgang wordt niet bewaard"
  current_state_lives_in_memory_and_expires_on_its_own: "De huidige staat leeft in het geheugen en verloopt vanzelf. Een crawler die drie maanden lang elke seconde rapporteert laat geen database groeien, en er valt achteraf niets op te ruimen. De ruil is bewust: er is geen geschiedenis en er zijn geen grafieken, alleen wat er nu gebeurt."
  what_it_will_not_do: "Wat het niet doet"
  send_commands_back: "Commando's terugsturen."
  it_is_a_departures_board_not_an_orchestrator: "Het is een vertrekbord, geen orkestrator. Een proces rapporteert; niets rapporteert eraan."
  keep_a_log: "Een log bijhouden."
  one_line_the_latest_per_task: "Eén regel, de laatste, per taak. Logopslag is een opgelost probleem en dit is het niet."
  nest_more_than_one_level: "Dieper dan één niveau nesten."
  a_task_may_have_steps_a_step_may_not: "Een taak mag stappen hebben; een stap niet."
  run_it_yourself: "Draai het zelf"
  the_docker_snippet: "het Docker-fragment"
  self_hosting_lowercase: "zelf hosten"
  the_server_is_open_source_and_self_hosting_is_one_container_html: "De server is open source en zelf hosten is één container: zie %{docker} om hem te starten en %{self_hosting} om hem fatsoenlijk te draaien. De gehoste dienst bestaat zodat jij het niet hoeft te doen, niet omdat de software zonder hem verminkt zou zijn."
  nothing_to_sign_up_for: "Nergens voor aan te melden"
  make_a_space_keep_its_link_and_start_reporting_into_it: "Maak een ruimte, bewaar de link, en begin er vanuit wat dan ook in te rapporteren."
  create_a_space: "Ruimte aanmaken"
  watch_any_script_crawler_ci_job_or_agent: "Volg elk script, elke crawler, CI-klus of agent. Het rapporteert voortgang met één HTTP-verzoek; jij kijkt mee waar je ook bent en krijgt een melding zodra het klaar is. Open source, zelf te hosten."
  the_server_is_open_source_under_the_agpl: "De server is open source onder de AGPL, en de gehoste dienst draait dezelfde image die jij zou draaien. Zelf hosten kost één container en één volume, en de database blijft voor altijd klein omdat voortgang er nooit in wordt geschreven."
  one_file: "Eén bestand"
  the_docker_page: "de Docker-pagina"
  docker_compose_yml_is_the_whole_install_html: "%{file} is de hele installatie. Het draait de gepubliceerde image, dus er valt niets te klonen en niets te bouwen. Kopieer het van %{docker}, die het huidige bestand afdrukt, en start het:"
  that_is_the_whole_setup_the_app_on_localhost_html: "Dat is de hele opzet: de app op %{url}, met Redis en SQLite in dezelfde container en alles wat ze bewaren op het benoemde volume. Open hem, maak een ruimte aan, en het Verbinden-menu van die ruimte geeft je commando's met de UUID er al in."
  configuring_it: "Instellen"
  the_file_is_yours_from_the_moment_you_save_it_html: "Het bestand is van jou vanaf het moment dat je het opslaat, en het is de enige plek waar iets wordt ingesteld. Elke instelling is een regel in een %{environment}-blok onder de service, dat het bestand weglaat tot je er een nodig hebt:"
  environment_variables_is_the_full_list_html: "%{link} is de volledige lijst, en alles daarop werkt hier. Om op een andere poort dan 7979 te publiceren verander je de linkerkant van %{ports} — de app binnen de container zit altijd op 3000."
  what_is_running: "Wat er draait"
  two_processes_and_a_file_the_app_answers_requests: "Twee processen en een bestand, alles in één container. De app beantwoordt verzoeken en draait de worker in zichzelf, want Sidekiq zit ingebed in Puma, en hij start Redis naast zich en stopt het bij het afsluiten. Redis houdt de huidige voortgang van elke taak en de jobwachtrij bij en schrijft van beide snapshots naar het volume; SQLite houdt spaces en de vorm van elke taak bij. Zet REDIS_URL en de app gebruikt die Redis in plaats daarvan en start er zelf geen."
  updating_it: "Bijwerken"
  pull_the_new_image_and_start_it_again: "Haal de nieuwe image op en start opnieuw:"
  every_running_task_stays_where_it_was: "Elke lopende taak blijft waar die was. Bij het stoppen van de container schrijft Redis een snapshot naar het volume, en de nieuwe container laadt die in bij het starten. Alleen een crash of stroomstoring slaat die stap over, en dan komt de laatste periodieke snapshot terug, minuten oud bij frequente rapportages en tot een uur oud als ze schaars zijn: een taak toont «Wachten op gegevens…» of een ouder getal tot de volgende rapportage."
  why_7979: "Waarom 7979"
  not_3000_this_is_a_service_you_leave_running_for_weeks_html: "Niet 3000. Dit is een dienst die je wekenlang laat draaien terwijl je werkt, en 3000 is waar je eigen ontwikkelservers landen — Rails, Vite, Next, Grafana en de helft van de %{run}-regels in andere handleidingen. Een achtergronddienst hoort niet de meest omstreden poort van de machine te bezetten, zeker niet een waarvan je de URL in een CI-secret plakt en daarna vergeet."
  inside_the_container_it_is_still_3000_html: "Binnen de container is het nog steeds 3000; alleen de gepubliceerde poort is verhuisd, en dat is de regel %{ports}."
  losing_the_volume_is_recoverable: "Het volume kwijtraken is te herstellen"
  spaces_task_structure_a_snapshot_of_redis_and_the_secret_key_are_on_it: "Ruimtes, taakstructuur, een snapshot van Redis en de geheime sleutel staan erop. Als het weg is maak je een nieuwe ruimte aan en vullen je rapporterende processen bij hun volgende verzoek alles weer aan, en een nieuwe geheime sleutel kost niets, want er zijn geen accounts om iemand uit te loggen. Maak er een back-up van als je liever geen nieuwe ruimte-UUID uitdeelt aan alles wat erin rapporteert, maar er staat niets op dat niet opnieuw op te bouwen is door de klussen nog eens te draaien."
  sqlite_or_postgresql: "SQLite of PostgreSQL"
  both_from_the_same_image_and_the_same_migrations_html: "Allebei, vanuit dezelfde image en dezelfde migraties, gekozen met %{database_url}. SQLite is de standaard en het juiste antwoord voor één machine: twee tabellen, opzoeken op primaire sleutel, bijna nooit schrijven. Wijs naar %{postgres} als je meerdere app-containers draait, want die kunnen geen bestand delen."
  behind_a_proxy: "Achter een proxy"
  set_force_ssl_true_once_something_in_front_terminates_tls_html: "Zet %{force_ssl} zodra iets vóór de app de TLS afhandelt. Het staat standaard uit zodat een installatie die je via gewoon HTTP bereikt je niet doorstuurt naar een certificaat dat je niet hebt."
  notifications_lowercase: "meldingen"
  set_a_vapid_key_pair_and_a_notify_me_button_appears_html: "Zet een VAPID-sleutelpaar en er verschijnt een «%{notify}»-knop op elke ruimte; laat de sleutels leeg en de functie bestaat niet. Er valt niets te registreren bij Apple of Google. Zie %{link} voor het hele verhaal, inclusief wat er op een telefoon moet gebeuren."
  sweeping_empty_spaces: "Lege ruimtes opruimen"
  ever: "ooit"
  opening_the_site_creates_a_space_for_you_html: "De site openen maakt een ruimte voor je aan, dus er ontstaan er heel wat die nooit gebruikt worden — ook door alles wat de pagina crawlt. Een ruimte die %{ever} een taak heeft bevat, blijft voorgoed bewaard, hoe lang niemand er ook naar kijkt. Alleen die nooit één taak bevatten worden opgeruimd, en pas als ze ouder zijn dan 30 dagen."
  nothing_runs_it_for_you_schedule_it_however_you_already_schedule_things: "Niets voert dat voor je uit. Plan het zoals je al dingen plant:"
  crontab_daily_at_0417: "crontab, dagelijks om 04:17"
  because_nothing_is_on_a_timer_30_days_is_a_floor: "Omdat niets op een timer loopt, zijn 30 dagen een ondergrens en geen schema: voer het dagelijks uit en lege ruimtes verdwijnen op de dag dat ze ervoor in aanmerking komen, één keer per jaar en ze blijven tot dan. Het overslaan is veilig voor je gegevens — de opruiming pakt alleen rijen die nooit gebruikt zijn — het betekent alleen dat de tabel groeit met ruimtes die niemand ooit heeft geopend."
  your_instance_is_not_indexable: "Jouw instantie is niet indexeerbaar"
  every_page_of_a_self_hosted_install_is_noindex_html: "Elke pagina van een zelf gehoste installatie is %{noindex}, %{robots} verbiedt alles, en %{sitemap} antwoordt 404. Vanaf iemands eigen machine is er geen publiek te bereiken en staat er niets dat in een zoekopdracht gevonden wil worden, en daar hoeft niets voor ingesteld te worden — zo krijg je het."
  the_point_of_the_whole_product_is_the_moment_a_job_finishes: "Het hele punt van dit product is het moment waarop een klus klaar is terwijl jij ergens anders bent. Progress Watch levert dat via Web Push, rechtstreeks van de server naar je browser — desktop en telefoon via één mechanisme, met niets ertussen dat van ons is."
  turning_it_on: "Aanzetten"
  push_is_opt_in_per_space_open_a_space_press_html: "Push kies je per ruimte. Open een ruimte, druk op %{notify}, en die browser is geregistreerd voor die ruimte en voor geen enkele andere. Er wordt niets over je opgeslagen tot je drukt, en de ruimte verwijderen schrijft hem weer uit."
  on_a_phone_install_the_site_first: "Op een telefoon: installeer eerst de site"
  add_to_home_screen: "Zet op beginscherm"
  ios_delivers_web_push_only_to_a_site_added_to_the_home_screen_html: "iOS levert Web Push alleen aan een site die aan het beginscherm is toegevoegd, en daar is niet omheen te komen: open de ruimte in Safari, Deel, %{add}, en druk daarvandaan op Waarschuw mij. Android en desktop werken vanuit een gewoon tabblad."
  installing_has_a_second_benefit_on_ios: "Installeren heeft op iOS een tweede voordeel. Safari wist de lokale opslag van een gewone site na zeven dagen zonder bezoek, en een geïnstalleerde web-app is daarvan uitgezonderd — en in die opslag staat je lijst met ruimtes. Er is geen account om hem uit terug te halen."
  a_tree_of_steps_is_one_notification: "Een boom van stappen is één melding"
  every_task_that_finishes_notifies_including_each_step_of_a_job: "Elke taak die klaar is stuurt een melding, ook elke stap van een klus. Ze stapelen niet: een stap vervangt de vorige melding van zijn klus ter plekke in plaats van er een bij te zetten, dus een deploy van tien stappen leest als één regel die blijft veranderen, en alleen het afronden van de klus zelf trilt opnieuw."
  what_each_party_learns: "Wat elke partij te weten komt"
  payloads_are_encrypted_for_the_browser_that_subscribed: "Payloads zijn versleuteld voor de browser die zich abonneerde, met sleutels die alleen hij heeft. Google, Mozilla en Apple geven versleutelde tekst door en kunnen je taaktitels niet lezen. Wat ze wel te weten komen is dat een bepaalde browser iets ontving, en wanneer."
  your_own_server_learns_one_thing_it_otherwise_would_not: "Je eigen server komt één ding te weten dat hij anders niet zou weten: dat een browser zich op een bepaalde ruimte heeft geabonneerd. Dat is de reden dat het een knop per ruimte is en geen globale instelling — de lijst met ruimtes die een browser bijhoudt leeft in die browser en nergens anders, en een abonnement is het enige dat een ruimte in de administratie van de server zet."
  if_you_are_self_hosting_push_content_minimal_html: "Als je zelf host stuurt %{minimal} «Task completed» zonder titel. De payload is hoe dan ook versleuteld; dit gaat over het vergrendelscherm van een telefoon die iemand anders kan zien."
  self_hosting_it_has_to_be_https: "Zelf hosten: het moet HTTPS zijn"
  a_browser_hands_out_a_service_worker_only_on_a_secure_origin_html: "Een browser geeft een service worker alleen af op een beveiligde oorsprong, en Web Push heeft er een nodig. Op %{address} verschijnt de knop helemaal niet, wat je sleutels ook zeggen — en niets legt uit waarom, want wat de pagina betreft bestaat de functie op die browser niet. %{localhost} is de ene uitzondering, en dat is precies waarom dit werkt terwijl je het uitprobeert en stopt zodra je het naar een machine in het netwerk verplaatst."
  so_notifications_mean_a_certificate_html: "Meldingen betekent dus een certificaat: iets ervoor dat de TLS afhandelt — Caddy, Traefik, nginx, een Cloudflare-tunnel — en %{force_ssl} zodra dat er staat."
  self_hosting_generating_the_keys: "Zelf hosten: de sleutels genereren"
  both_keys_unset_means_the_feature_does_not_exist_generate_a_pair_once: "Beide sleutels leeg betekent dat de functie niet bestaat — geen knop, en niets opgeslagen over wie dan ook. Genereer één keer een paar:"
  put_both_into_the_environment_block_and_run_up_again_html: "Zet ze allebei in het %{environment}-blok in docker-compose.yml en doe opnieuw %{up}. Niet %{restart}, dat hergebruikt de configuratie die de container al heeft."
  there_is_nothing_to_register_anywhere_lead: "Er valt nergens iets te registreren"
  there_is_nothing_to_register_anywhere_html: "%{nothing} — geen Firebase-project, geen Apple-ontwikkelaarsaccount, geen API-sleutel. Wie de browser maakte, draait de pushdienst; het adres ervan komt mee in het abonnement dat de browser aan je server geeft, en het VAPID-paar is het zelfondertekende bewijs dat elke melding van dezelfde afzender kwam. %{subject} is alleen een contactadres en niemand controleert het."
  do_not_rotate_the_keys_existing_subscriptions_are_bound_to_them: "Roteer de sleutels niet. Bestaande abonnementen zijn eraan gebonden, browsers worden niet ingelicht, en ze ontvangen simpelweg niets meer."
  why_there_is_no_mobile_app: "Waarom er geen mobiele app is"
  a_react_native_app_was_designed_for_this_and_has_not_been_built: "Er is een React Native-app voor ontworpen en niet gebouwd, omdat Web Push dekt waar hij voor was. Het enige dat hij nog steeds beter zou doen is meerdere servers tegelijk in de gaten houden: een browser is aan één oorsprong gebonden, dus een ruimte op een andere server opent op die server in plaats van zich bij één lijst te voegen. Kijk je naar een gehoste ruimte en een zelf gehoste, installeer de site dan vanaf beide."
  everything_is_an_environment_variable: "Alles is een omgevingsvariabele. Er zijn geen configuratiebestanden om te bewerken en geen versleutelde inloggegevens in de image gebakken, dus dezelfde container draait op een NAS thuis en in de cloud."
  general: "Algemeen"
  variable: "Variabele"
  default: "Standaard"
  what_it_does: "Wat het doet"
  generated_on_first_start_and_kept_on_the_volume: "Wordt bij de eerste start gegenereerd en op het volume bewaard, dus laat hem leeg. Stel hem zelf in waar geen volume is, of waar meerdere containers hem moeten delen."
  where_spaces_and_task_structure_live_html: "Waar ruimtes en taakstructuur leven. Het standaardbestand is wat het Docker-volume bevat; wijs naar %{postgres} voor een cloudinstallatie. De voortgang zelf wordt hier nooit geschreven."
  set_true_when_something_in_front_terminates_tls_html: "Zet op %{value} wanneer iets ervoor de TLS afhandelt. Het stuurt ook %{assume} aan, dus uit laten houdt de app bruikbaar via gewoon HTTP in plaats van door te sturen naar een certificaat dat je niet hebt."
  the_port_puma_binds_inside_the_container_html: "De poort waarop Puma binnen de container luistert. %{compose} publiceert hem op 7979, omdat een dienst die je wekenlang laat draaien niet de poort hoort te bezetten die je eigen ontwikkelservers willen."
  logs_go_to_stdout_and_nowhere_else_this_is_how_much_of_them: "Logs gaan naar stdout en nergens anders heen. Dit is hoeveel ervan."
  how_many_spaces_and_tasks_one_address_may_create_per_hour: "Hoeveel ruimtes en taken één adres per uur mag aanmaken. Niet gezet betekent geen limiet, wat het juiste antwoord is voor een server die alleen jij kunt bereiken. Voortgang rapporteren wordt nooit beperkt."
  behind_a_proxy_the_limit_is_only_as_good_as_the_address_html: "Achter een proxy is %{limit} niet beter dan het adres dat de app ziet. Rails leest %{forwarded} en vertrouwt die vanuit privébereiken, wat een reverse proxy op dezelfde host stuurt — maar als de header niet aankomt, lijkt elk verzoek op één client en sluit de limiet iedereen tegelijk buiten in plaats van niemand."
  redis_holds_two_unrelated_things: "Redis houdt twee ongerelateerde dingen bij: de huidige voortgang van elke taak, en de Sidekiq-wachtrij. Dat zijn standaard twee logische databases van één server, en beide kunnen naar een eigen instantie verhuizen."
  the_server_used_for_both_roles_split_into_db_0_and_db_1: "De server voor beide rollen, verdeeld over db 0 voor voortgang en db 1 voor de wachtrij. Leeg gelaten draait de image een eigen Redis in de container en schrijft er snapshots van naar het volume."
  overrides_the_progress_store_alone: "Vervangt alleen de voortgangsopslag."
  overrides_the_queue_alone: "Vervangt alleen de wachtrij."
  how_long_a_task_keeps_its_progress_without_being_written_to: "Hoe lang een taak haar voortgang houdt zonder beschreven te worden. Elke rapportage vernieuwt dat, dus dit is eigenlijk hoe lang een verlaten taak in beeld blijft."
  key_prefix_for_the_progress_store: "Sleutelprefix voor de voortgangsopslag, zodat die een database met iets anders kan delen."
  both_keys_unset_means_the_feature_does_not_exist_no_button_on_a_space: "Beide sleutels leeg betekent dat de functie niet bestaat: geen knop op een ruimte, en niets opgeslagen over wie dan ook. Er valt niets te registreren bij Apple of Google — wie de browser maakte, draait de pushdienst. Genereer één keer een paar en roteer het niet; bestaande abonnementen zijn eraan gebonden en browsers worden niet ingelicht."
  public_half_of_the_pair_that_signs_every_push: "Publieke helft van het paar dat elke push ondertekent. Wordt aan de browser gegeven wanneer die zich abonneert."
  private_half_never_leaves_the_server: "Private helft. Verlaat de server nooit."
  a_contact_address_the_push_services_can_reach: "Een contactadres waarop de pushdiensten je kunnen bereiken als er iets misgaat. Niemand controleert het."
  full_puts_the_task_title_in_the_notification_html: "%{full} zet de taaktitel in de melding, %{minimal} stuurt «Task completed» en niets herkenbaars."
  process_sizing: "Processen dimensioneren"
  puma_threads_per_process_and_the_size_of_both_pools: "Puma-threads per proces, en de grootte van zowel de database- als de Redis-verbindingspool."
  puma_worker_processes_zero_runs_a_single_process: "Puma-workerprocessen. Nul draait één enkel proces, wat het juiste antwoord is op een kleine machine."
  threads_in_the_sidekiq_process: "Threads in het Sidekiq-proces. Meldingen sturen is de enige klus die er is."
  sidekiq_runs_inside_puma_set_false_to_run_it_as_its_own_process: "Sidekiq draait in Puma. Zet op `false` waar een eigen workerproces draait."
