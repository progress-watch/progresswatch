  give_an_ai_agent_a_skill_for_reporting_its_own_progress: "Dai a un agente IA una skill per riportare il proprio avanzamento in Progress Watch."
  the_skill_drives_the_cli_so_the_agent_needs_no_server_or_uuid_of_its_own: "La skill guida la CLI, quindi l'agente non ha bisogno di un server o di un uuid propri: usa quello per cui questa macchina è già configurata."
  install_the_cli_the_skill_is_a_set_of_instructions_for_driving_it: "Installa la CLI. La skill è un insieme di istruzioni per guidarla."
  point_it_at_this_server_saved_to_progresswatchrc: "Puntala a questo server. Viene salvato in ~/.progresswatchrc, quindi è una volta sola."
  create_a_space_for_the_agent_to_report_into: "Crea uno spazio in cui l'agente possa riportare."
  point_it_at_this_space_use_local_to_bind_it_to_one_project: "Puntala a questo spazio. Usa --local per legarlo a un solo progetto."
  install_the_skill_it_knows_75_agents: "Installa la skill. Conosce più di 75 agenti e chiede per quale installarla."
  that_is_all_the_agent_decides_on_its_own_when_work_is_worth_tracking: "Tutto qui: l'agente decide da solo quando vale la pena tracciare un lavoro, crea un'attività per il lavoro e una sotto-attività per passaggio, e chiude ciascuna man mano che finisce. Se preferisci non eseguire l'installer di qualcun altro, lo stesso file è skills/progresswatch-cli/SKILL.md in quel repository, e va in .claude/skills/."
  mcp: "MCP"
  connect_an_agent_over_mcp: "Connettere un agente via MCP"
  connect_an_ai_agent_to_progress_watch_over_mcp: "Connetti un agente IA a Progress Watch via MCP."
  add_the_server: "Aggiungi il server."
  or_write_it_into_mcp_json_yourself: "Oppure scrivilo tu stesso in .mcp.json."
  the_space_uuid_sits_in_the_url_so_any_client_that_takes_only_a_url_works: "L'uuid dello spazio sta nell'URL, quindi funziona qualsiasi client che accetti solo un URL. Per tenerlo fuori dal percorso, mandalo invece come header."
  four_tools_create_space_create_task_update_task_complete_task: "Quattro strumenti: create_space, create_task, update_task, complete_task. L'agente decide da solo quando creare un'attività e con quale frequenza riportare. Uno connesso senza spazio può chiamare create_space e restituirti l'URL, quindi non resta mai senza un posto dove riportare."
  curl: "curl"
  try_the_api_with_curl: "Provare l'API con curl"
  try_the_api_with_curl_and_report_from_a_client_that_can_only_fire_a_url: "Prova l'API di Progress Watch con curl, e riporta da un client che può solo lanciare un URL."
  create_a_space_keep_its_uuid_whoever_has_it_can_read_and_write_here: "Crea uno spazio, tieni il suo uuid. Chi ce l'ha può leggere e scrivere qui."
  create_a_task_keep_its_uuid: "Crea un'attività, tieni il suo uuid."
  report_progress_every_write_replaces_the_whole_state: "Riporta l'avanzamento. Ogni scrittura sostituisce l'intero stato: manda tutto ogni volta."
  finish_it_this_is_what_sends_the_notification: "Concludila. È questo che manda la notifica."
  that_is_the_whole_surface_and_it_is_what_the_cli_and_the_mcp_tools_call: "Questa è tutta la superficie, ed è ciò che chiamano la CLI e gli strumenti MCP. Per qualcosa che usi ogni giorno la CLI è una riga invece di quattro; per costruirci sopra, il riferimento dell'API e OpenAPI 3.1 sono su /openapi.json."
  one_more_for_a_client_that_cannot_do_the_above: "Un'altra ancora, per un client che non può fare quanto sopra. Ad alcune cose si può solo passare un URL: un pinger di uptime, un campo webhook nel prodotto di qualcun altro, un router o un sensore, una riga di cron con un curl nudo. Non possono scegliere un metodo né mandare un corpo, quindi la stessa scrittura è raggiungibile come semplice GET."
  the_g_is_for_curl_not_for_us: "Il -g è per curl, non per noi: curl legge le parentesi quadre in un URL come un intervallo e rifiuta l'indirizzo senza di esso. Tutto ciò che si limita a lanciare un URL non ha bisogno di niente di speciale."
  use_it_only_when_there_is_no_alternative_it_is_a_get_that_writes: "Usalo solo quando non c'è alternativa. È un GET che scrive, quindi qualsiasi cosa segua l'URL esegue la scrittura: incollalo in una chat e l'anteprima del link riporta al posto tuo. Se il tuo client può mandare un corpo della richiesta, il PUT qui sopra è quello giusto."
  docker: "Docker"
  self_host_progress_watch_with_docker: "Autogestire Progress Watch con Docker"
  the_docker_compose_file_for_running_your_own_server: "Il file Docker Compose per far girare il proprio server Progress Watch."
  your_own_server_on_your_own_box: "Il tuo server, sulla tua macchina. Niente qui parla con progress.watch."
  save_this_as_docker_compose_yml_it_runs_the_published_image: "Salva questo come docker-compose.yml. Avvia l'immagine pubblicata, quindi non c'è niente da clonare e niente da compilare — e da qui in poi è tuo da modificare."
  generate_a_secret_and_paste_it_over_the_placeholder: "Genera un segreto e incollalo sopra il segnaposto."
  start_it_the_app_a_redis_and_a_sqlite_file: "Avvialo. L'app, un Redis e un file SQLite su un volume."
  then_point_the_cli_at_it_this_page_is_served_from_server: "Poi puntaci la CLI. Questa pagina è servita da {{server}}."
  that_is_a_working_server_notifications_postgres_and_the_one_click_deploy: "Ecco un server funzionante. Le notifiche, Postgres, l'unica cosa che merita un cron e il deploy con un clic sono tutti in Autogestione, nella barra laterale."
  an_introduction_to_progress_watch_an_open_source_progress_tracker: "Un'introduzione a Progress Watch, un tracciatore di avanzamento open source per tutto ciò che gira senza di te."
  watch_any_process: "Guarda qualsiasi processo"
  some_things_run_for_hours_with_nobody_watching: "Certe cose girano per ore senza che nessuno guardi: una scansione notturna, un addestramento, una migrazione, una pipeline di CI, un agente che si fa strada in un'attività lunga. Progress Watch dà loro un posto a cui riportare, e dà a te un posto dove guardare — più una notifica quando finiscono."
  three_commands_from_inside_the_work: "Tre comandi dall'interno del lavoro"
  create_a_task_where_the_job_starts_report_against_it_as_it_moves: "Crea un'attività dove il lavoro comincia, riporta su di essa mentre procede, chiudila quando è finita. Quello di mezzo è la chiamata che va nel tuo ciclo, ed è l'unica cosa che conosce i numeri."
  counts_not_percentages_the_screen_shows_html: "Conteggi, non percentuali: lo schermo mostra %{counts}, che ti dice qualcosa che %{percent} non dice. Il totale può cambiare mentre un lavoro scopre altro da fare — manda il numero nuovo e la barra si ricalcola. La pagina %{cli} li ha tutti e tre, pronti da incollare."
  when_the_process_is_not_yours_to_change_html: "Quando il processo non è tuo da modificare, %{run} lo avvolge per intero: crea l'attività, lascia passare l'output intatto e la chiude con il codice di uscita, così un lavoro che fallisce ti avvisa lo stesso. Riporta inizio e fine invece dei conteggi, perché niente al di fuori di un processo sa a che punto è."
  or_one_request_from_anything: "Oppure una richiesta, da qualsiasi cosa"
  underneath_all_of_it_is_a_single_http_request_html: "Sotto tutto questo c'è una sola richiesta HTTP, e quella è tutta l'API. Non c'è alcun SDK da installare né niente da importare, perché avvolgere un %{put} non aggiungerebbe nulla che tu non possa scrivere da solo in meno tempo di quanto ne serva per leggerne la documentazione."
  api_reference: "riferimento dell'API"
  the_api_reference_is_the_reference_to_build_against_html: "Il %{api} è il riferimento su cui costruire, e incollare gli esempi %{curl} è il modo più rapido per vedere la cosa funzionare prima di impegnarti."
  agents_report_their_own_work: "Gli agenti riportano il proprio lavoro"
  agent_skill_lowercase: "skill per agenti"
  an_ai_agent_breaks_a_job_into_steps_html: "Un agente IA divide un lavoro in passaggi e poi lavora a lungo senza niente da mostrare. Connettine uno via %{mcp} e ottiene strumenti per creare un'attività e riportarci sopra: un'attività per il lavoro, una sotto-attività per passaggio, aggiornate man mano. MCP non richiede installazioni da nessuna parte; per un client che non lo parla, una %{skill} insegna la stessa cosa tramite la CLI."
  the_agent_decides_when_tracking_is_worth_it_and_how_often_to_report: "L'agente decide quando vale la pena tracciare e con quale frequenza riportare. Le descrizioni degli strumenti gli dicono a cosa serve un'attività, non una tabella di marcia da seguire."
  no_accounts: "Nessun account"
  a_space_is_a_container_for_tasks_and_its_uuid_is_the_credential: "Uno spazio è un contenitore di attività, e il suo UUID è la credenziale. Chi ha il link può leggerlo e scriverci; condividere significa dare il link a qualcuno. Non c'è niente per cui registrarsi, niente in cui accedere e nessuna password da perdere — il che significa anche che il link è l'unica via di ritorno a uno spazio, quindi vale la pena conservarlo come un token API."
  progress_is_not_stored: "L'avanzamento non viene conservato"
  current_state_lives_in_memory_and_expires_on_its_own: "Lo stato corrente vive in memoria e scade da solo. Un crawler che riporta ogni secondo per tre mesi non fa crescere nessun database, e dopo non c'è niente da ripulire. Il compromesso è voluto: non c'è storico e non ci sono grafici, solo ciò che sta accadendo ora."
  what_it_will_not_do: "Cosa non farà"
  send_commands_back: "Rimandare indietro comandi."
  it_is_a_departures_board_not_an_orchestrator: "È un tabellone delle partenze, non un orchestratore. Un processo riporta; niente riporta a lui."
  keep_a_log: "Tenere un log."
  one_line_the_latest_per_task: "Una riga, l'ultima, per attività. Conservare i log è un problema risolto e non è questo."
  nest_more_than_one_level: "Annidare più di un livello."
  a_task_may_have_steps_a_step_may_not: "Un'attività può avere passaggi; un passaggio no."
  run_it_yourself: "Fallo girare tu"
  the_docker_snippet: "lo snippet Docker"
  self_hosting_lowercase: "autogestione"
  the_server_is_open_source_and_self_hosting_is_one_container_html: "Il server è open source e autogestirlo è un container più un Redis: vedi %{docker} per avviarlo e %{self_hosting} per farlo girare come si deve. Il servizio ospitato esiste perché tu non debba farlo, non perché il software sia mutilato senza di esso."
  nothing_to_sign_up_for: "Niente per cui registrarsi"
  make_a_space_keep_its_link_and_start_reporting_into_it: "Crea uno spazio, conserva il suo link, e comincia a riportarci dentro da qualsiasi cosa."
  create_a_space: "Crea uno spazio"
  watch_any_script_crawler_ci_job_or_agent: "Guarda qualsiasi script, crawler, job di CI o agente. Riporta l'avanzamento con una sola richiesta HTTP; tu lo guardi da dove sei e ricevi una notifica quando finisce. Open source, autogestibile."
  the_server_is_open_source_under_the_agpl: "Il server è open source sotto licenza AGPL, e il servizio ospitato usa la stessa immagine che useresti tu. Ospitarlo per conto proprio costa un container e un Redis, e il database resta piccolo per sempre perché l'avanzamento non ci viene mai scritto."
  one_file: "Un solo file"
  the_docker_page: "la pagina Docker"
  docker_compose_yml_is_the_whole_install_html: "%{file} è tutta l'installazione. Avvia l'immagine pubblicata, quindi non c'è niente da clonare e niente da compilare: copialo dalla %{docker}, che stampa il file corrente, sostituisci il segreto segnaposto con %{generate} e avvialo:"
  that_is_the_whole_setup_the_app_on_localhost_html: "Questa è tutta la configurazione: l'app su %{url}, un Redis e un file SQLite su un volume con nome. Aprila, crea uno spazio, e il menu Connetti di quello spazio ti dà i comandi con l'UUID già inserito."
  configuring_it: "Configurarlo"
  the_file_is_yours_from_the_moment_you_save_it_html: "Il file è tuo dal momento in cui lo salvi, ed è l'unico posto in cui si configura qualcosa: ogni impostazione è una riga in un blocco %{environment}, quindi aggiungerne una significa aggiungere una riga:"
  environment_variables_is_the_full_list_html: "%{link} è l'elenco completo, e tutto ciò che vi compare funziona qui. Per pubblicare su una porta diversa dalla 7979, cambia la parte sinistra di %{ports}: l'app dentro il container è sempre sulla 3000."
  what_is_running: "Cosa sta girando"
  two_processes_and_a_file_the_app_answers_requests: "Due processi e un file. L'app risponde alle richieste ed esegue il worker al proprio interno — Sidekiq è incorporato in Puma, quindi a una notifica non può mancare un servizio dedicato. Redis tiene il progresso corrente di ogni attività e la coda dei job; SQLite tiene gli spazi e la forma di ogni attività."
  updating_it: "Aggiornarlo"
  name_the_service_a_bare_pull_takes_redis_with_it_html: "Indica il servizio. Un %{pull} da solo scarica anche Redis, e se è stato pubblicato un %{redis} più recente, %{up} sostituisce anche quel container — buttando via il progresso di tutto ciò che sta girando."
  replacing_only_the_app_container_leaves_every_running_task_where_it_was_html: "Sostituire solo il container dell'app lascia ogni attività in corso esattamente dov'era, perché il progresso sta in Redis e Redis non è stato toccato. Titoli e struttura sono sul volume e sopravvivono comunque. Nulla sopravvive a %{down} o a un riavvio dell'host: Redis non tiene nulla su disco, di proposito."
  why_7979: "Perché la 7979"
  not_3000_this_is_a_service_you_leave_running_for_weeks_html: "Non la 3000. Questo è un servizio che lasci acceso per settimane mentre lavori, e la 3000 è dove atterrano i tuoi server di sviluppo: Rails, Vite, Next, Grafana e metà delle righe %{run} delle altre guide. Un servizio in background non dovrebbe occupare la porta più contesa della macchina, tanto meno una il cui URL incolli in un segreto di CI e poi dimentichi."
  inside_the_container_it_is_still_3000_html: "Dentro il container è ancora la 3000; si è spostata solo la porta pubblicata, ed è la riga %{ports}."
  losing_the_volume_is_recoverable: "Perdere il volume è recuperabile"
  spaces_and_task_structure_are_on_it_and_nothing_else: "Ci sono sopra gli spazi e la struttura delle attività, e nient'altro. Se sparisce, crei un nuovo spazio e i tuoi processi ripopolano tutto alla richiesta successiva. Fanne un backup se preferisci non ridistribuire un nuovo UUID di spazio a tutto ciò che ci riporta dentro, ma non c'è niente sopra che non possa essere ricostruito rieseguendo i job."
  sqlite_or_postgresql: "SQLite o PostgreSQL"
  both_from_the_same_image_and_the_same_migrations_html: "Entrambi, dalla stessa immagine e dalle stesse migrazioni, scelti con %{database_url}. SQLite è il predefinito ed è la risposta giusta per una sola macchina: due tabelle, letture per chiave primaria, quasi mai scritture. Punta a %{postgres} quando fai girare più container dell'app, perché non possono condividere un file."
  behind_a_proxy: "Dietro un proxy"
  set_force_ssl_true_once_something_in_front_terminates_tls_html: "Imposta %{force_ssl} non appena qualcosa davanti all'app termina il TLS. È spento per impostazione predefinita perché un'installazione raggiunta via HTTP semplice non ti reindirizzi verso un certificato che non hai."
  notifications_lowercase: "notifiche"
  set_a_vapid_key_pair_and_a_notify_me_button_appears_html: "Imposta una coppia di chiavi VAPID e su ogni spazio compare un pulsante «%{notify}»; lascia le chiavi vuote e la funzione non esiste. Non c'è niente da registrare con Apple o Google. Vedi %{link} per la storia completa, compreso cosa deve accadere su un telefono."
  sweeping_empty_spaces: "Ripulire gli spazi vuoti"
  ever: "mai"
  opening_the_site_creates_a_space_for_you_html: "Aprire il sito crea uno spazio per te, quindi se ne creano parecchi che non vengono mai usati, compresi quelli di qualunque cosa faccia scansione della pagina. Uno spazio che ha %{ever} contenuto un'attività viene conservato per sempre, per quanto a lungo nessuno lo guardi. Vengono ripuliti solo quelli che non hanno mai contenuto nemmeno un'attività, e solo quando hanno più di 30 giorni."
  nothing_runs_it_for_you_schedule_it_however_you_already_schedule_things: "Niente lo esegue al posto tuo. Pianificalo come già pianifichi le cose:"
  crontab_daily_at_0417: "crontab, ogni giorno alle 04:17"
  because_nothing_is_on_a_timer_30_days_is_a_floor: "Poiché niente gira su un timer, 30 giorni sono un minimo e non un calendario: eseguilo ogni giorno e gli spazi vuoti se ne vanno il giorno in cui ne hanno i requisiti, eseguilo una volta l'anno e restano fino ad allora. Saltarlo è sicuro per i tuoi dati — la pulizia prende solo righe che non sono mai state usate — significa soltanto che la tabella cresce con spazi che nessuno ha mai aperto."
  your_instance_is_not_indexable: "La tua istanza non è indicizzabile"
  every_page_of_a_self_hosted_install_is_noindex_html: "Ogni pagina di un'installazione autogestita è %{noindex}, %{robots} vieta tutto, e %{sitemap} risponde 404. Dalla macchina di qualcuno non c'è pubblico da raggiungere e non c'è nulla lì dentro che voglia essere trovato in una ricerca, e non c'è niente da configurare perché sia così: è quello che ottieni."
  the_point_of_the_whole_product_is_the_moment_a_job_finishes: "Il senso dell'intero prodotto è il momento in cui un lavoro finisce mentre tu sei altrove. Progress Watch lo consegna via Web Push, direttamente dal server al tuo browser: desktop e telefono attraverso un unico meccanismo, senza nulla in mezzo che appartenga a noi."
  turning_it_on: "Attivarlo"
  push_is_opt_in_per_space_open_a_space_press_html: "Il push si sceglie spazio per spazio. Apri uno spazio, premi %{notify}, e quel browser è registrato per quello spazio e per nessun altro. Finché non premi non viene memorizzato nulla su di te, e rimuovere lo spazio lo disiscrive di nuovo."
  on_a_phone_install_the_site_first: "Su un telefono, installa prima il sito"
  add_to_home_screen: "Aggiungi a Home"
  ios_delivers_web_push_only_to_a_site_added_to_the_home_screen_html: "iOS consegna il Web Push solo a un sito aggiunto alla schermata Home, e non c'è modo di aggirarlo: apri lo spazio in Safari, Condividi, %{add}, e premi Avvisami da lì. Android e desktop funzionano da una scheda normale."
  installing_has_a_second_benefit_on_ios: "Installarlo ha un secondo vantaggio su iOS. Safari cancella la memoria locale di un sito normale dopo sette giorni senza visite, e una web app installata ne è esente — ed è in quella memoria che vive il tuo elenco di spazi. Non esiste nessun account da cui ripristinarlo."
  a_tree_of_steps_is_one_notification: "Un albero di passaggi è una sola notifica"
  every_task_that_finishes_notifies_including_each_step_of_a_job: "Ogni attività che finisce avvisa, compreso ogni passaggio di un lavoro. Non si impilano: un passaggio sostituisce sul posto la notifica precedente del suo lavoro invece di aggiungersi, quindi un deploy da dieci passaggi si legge come una riga che continua a cambiare, e solo la conclusione del lavoro stesso vibra di nuovo."
  what_each_party_learns: "Cosa impara ciascuna parte"
  payloads_are_encrypted_for_the_browser_that_subscribed: "I payload sono cifrati per il browser che si è iscritto, con chiavi che ha solo lui. Google, Mozilla e Apple inoltrano testo cifrato e non possono leggere i titoli delle tue attività. Quello che imparano è che un certo browser ha ricevuto qualcosa, e quando."
  your_own_server_learns_one_thing_it_otherwise_would_not: "Il tuo server impara una cosa che altrimenti non saprebbe: che un browser si è iscritto a un dato spazio. È questa la ragione per cui è un pulsante per spazio e non un'impostazione globale: l'elenco degli spazi che un browser tiene vive in quel browser e da nessun'altra parte, e un'iscrizione è l'unica cosa che porta uno spazio nei registri del server."
  if_you_are_self_hosting_push_content_minimal_html: "Se ti ospiti da solo, %{minimal} invia «Task completed» senza titolo. Il payload è cifrato in entrambi i casi; questo riguarda la schermata di blocco di un telefono che qualcun altro può vedere."
  self_hosting_it_has_to_be_https: "Autogestito: deve essere HTTPS"
  a_browser_hands_out_a_service_worker_only_on_a_secure_origin_html: "Un browser consegna un service worker solo su un'origine sicura, e il Web Push ne richiede una. Su %{address} il pulsante non compare affatto, qualunque cosa dicano le tue chiavi — e nulla spiega il perché, perché per quanto riguarda la pagina la funzione su quel browser non esiste. %{localhost} è l'unica eccezione, ed è esattamente per questo che funziona mentre lo provi e smette nel momento in cui lo sposti su una macchina in rete."
  so_notifications_mean_a_certificate_html: "Quindi notifiche vuol dire certificato: qualcosa davanti che termini il TLS — Caddy, Traefik, nginx, un tunnel Cloudflare — e %{force_ssl} impostato una volta che c'è."
  self_hosting_generating_the_keys: "Autogestito: generare le chiavi"
  both_keys_unset_means_the_feature_does_not_exist_generate_a_pair_once: "Entrambe le chiavi vuote significano che la funzione non esiste: nessun pulsante e niente memorizzato su nessuno. Genera una coppia una volta sola:"
  put_both_into_the_environment_block_and_run_up_again_html: "Metti entrambe nel blocco %{environment} in docker-compose.yml e rilancia %{up}. Non %{restart}, che riusa la configurazione che il container ha già."
  there_is_nothing_to_register_anywhere_lead: "Non c'è niente da registrare da nessuna parte"
  there_is_nothing_to_register_anywhere_html: "%{nothing}: nessun progetto Firebase, nessun account sviluppatore Apple, nessuna chiave API. Chi ha fatto il browser gestisce il servizio di push; il suo indirizzo arriva dentro l'iscrizione che il browser consegna al tuo server, e la coppia VAPID è la prova autofirmata che ogni notifica è arrivata dallo stesso mittente. %{subject} è solo un indirizzo di contatto e nessuno lo verifica."
  do_not_rotate_the_keys_existing_subscriptions_are_bound_to_them: "Non ruotare le chiavi. Le iscrizioni esistenti sono legate a esse, i browser non vengono informati, e semplicemente smettono di ricevere."
  why_there_is_no_mobile_app: "Perché non c'è un'app mobile"
  a_react_native_app_was_designed_for_this_and_has_not_been_built: "Un'app React Native era stata progettata per questo e non è stata costruita, perché il Web Push copre ciò per cui serviva. L'unica cosa che farebbe ancora meglio è guardare più server insieme: un browser è legato a un'origine, quindi uno spazio su un altro server si apre su quel server invece di unirsi a un unico elenco. Se guardi uno spazio ospitato e uno autogestito, installa il sito da ciascuno."
  everything_is_an_environment_variable: "Tutto è una variabile d'ambiente. Non ci sono file di configurazione da modificare né credenziali cifrate cotte dentro l'immagine, quindi lo stesso container gira su un NAS di casa e nel cloud."
  general: "Generale"
  variable: "Variabile"
  default: "Predefinito"
  what_it_does: "Cosa fa"
  the_only_variable_that_is_required_in_production_html: "L'unica variabile obbligatoria in produzione. Generane una con %{generate} e conservala."
  where_spaces_and_task_structure_live_html: "Dove vivono gli spazi e la struttura delle attività. Il file predefinito è ciò che contiene il volume Docker; punta a %{postgres} per un deploy nel cloud. L'avanzamento in sé non viene mai scritto qui."
  set_true_when_something_in_front_terminates_tls_html: "Imposta %{value} quando qualcosa davanti termina il TLS. Guida anche %{assume}, quindi lasciarlo spento mantiene l'app usabile via HTTP semplice invece di reindirizzare a un certificato che non hai."
  the_port_puma_binds_inside_the_container_html: "La porta a cui Puma si lega dentro il container. %{compose} la pubblica sulla 7979, perché un servizio lasciato acceso per settimane non dovrebbe occupare la porta che vogliono i tuoi server di sviluppo."
  logs_go_to_stdout_and_nowhere_else_this_is_how_much_of_them: "I log vanno su stdout e da nessun'altra parte. Questo è quanti."
  how_many_spaces_and_tasks_one_address_may_create_per_hour: "Quanti spazi e attività può creare un indirizzo all'ora. Non impostato significa nessun limite, che è la risposta giusta per un server che puoi raggiungere solo tu. Riportare l'avanzamento non è mai limitato."
  behind_a_proxy_the_limit_is_only_as_good_as_the_address_html: "Dietro un proxy, %{limit} vale quanto l'indirizzo che l'app vede. Rails legge %{forwarded} e si fida di esso dagli intervalli privati, che è ciò che manda un reverse proxy sullo stesso host — ma se l'header non arriva, ogni richiesta sembra un solo client e il limite blocca tutti insieme invece di nessuno."
  redis_holds_two_unrelated_things: "Redis tiene due cose senza rapporto: l'avanzamento corrente di ogni attività e la coda di Sidekiq. Per impostazione predefinita sono due database logici di un unico server, ed entrambi possono essere spostati su un'istanza propria."
  the_server_used_for_both_roles_split_into_db_0_and_db_1: "Il server usato per entrambi i ruoli, diviso in db 0 per l'avanzamento e db 1 per la coda."
  overrides_the_progress_store_alone: "Sostituisce il solo archivio dell'avanzamento."
  overrides_the_queue_alone: "Sostituisce la sola coda."
  how_long_a_task_keeps_its_progress_without_being_written_to: "Per quanto un'attività conserva il suo avanzamento senza essere scritta. Ogni report lo rinfresca, quindi questo è in realtà per quanto un'attività abbandonata resta a schermo."
  key_prefix_for_the_progress_store: "Prefisso delle chiavi dell'archivio dell'avanzamento, così può condividere un database con qualcos'altro."
  both_keys_unset_means_the_feature_does_not_exist_no_button_on_a_space: "Entrambe le chiavi vuote significano che la funzione non esiste: nessun pulsante su uno spazio e niente memorizzato su nessuno. Non c'è niente da registrare con Apple o Google: chi ha fatto il browser gestisce il servizio di push. Genera una coppia una volta sola e non ruotarla; le iscrizioni esistenti sono legate a essa e i browser non vengono informati."
  public_half_of_the_pair_that_signs_every_push: "Metà pubblica della coppia che firma ogni push. Consegnata al browser quando si iscrive."
  private_half_never_leaves_the_server: "Metà privata. Non lascia mai il server."
  a_contact_address_the_push_services_can_reach: "Un indirizzo di contatto che i servizi di push possono raggiungere se qualcosa va storto. Nessuno lo verifica."
  full_puts_the_task_title_in_the_notification_html: "%{full} mette il titolo dell'attività nella notifica, %{minimal} invia «Task completed» e niente di identificabile."
  process_sizing: "Dimensionare i processi"
  puma_threads_per_process_and_the_size_of_both_pools: "Thread di Puma per processo, e dimensione sia del pool di connessioni al database sia di quello a Redis."
  puma_worker_processes_zero_runs_a_single_process: "Processi worker di Puma. Zero fa girare un solo processo, che è la risposta giusta su una macchina piccola."
  threads_in_the_sidekiq_process: "Thread nel processo Sidekiq. Mandare notifiche è l'unico lavoro che c'è."
  sidekiq_runs_inside_puma_set_false_to_run_it_as_its_own_process: "Sidekiq gira dentro Puma. Imposta `false` dove gira un processo worker dedicato."
