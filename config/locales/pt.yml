  report_as_it_moves_this_is_the_call_that_goes_in_your_loop: "Reporte à medida que avança. Esta é a chamada que vai no seu ciclo, e a única que conhece os números."
  close_it_this_is_what_sends_the_notification: "Feche-a. É isto que envia a notificação, por isso chame-o também quando falhar."
  or_wrap_a_process_that_is_not_yours_to_change: "Ou envolva um processo que não está na sua mão alterar. Reporta início e fim em vez de números, e sai com o estado do comando."
  in_ci_there_is_no_config_file_to_write: "Em CI não há ficheiro de configuração para escrever, por isso passe-o pelo ambiente."
  agent_skill: "Skill de agente"
  give_an_ai_agent_a_progress_skill: "Dar a um agente de IA uma skill de progresso"
  give_an_ai_agent_a_skill_for_reporting_its_own_progress: "Dê a um agente de IA uma skill para reportar o seu próprio progresso ao Progress Watch."
  the_skill_drives_the_cli_so_the_agent_needs_no_server_or_uuid_of_its_own: "A skill conduz a CLI, por isso o agente não precisa de servidor nem de uuid próprios — usa aquilo para que esta máquina já está configurada."
  install_the_cli_the_skill_is_a_set_of_instructions_for_driving_it: "Instale a CLI. A skill é um conjunto de instruções para a conduzir."
  point_it_at_this_server_saved_to_progresswatchrc: "Aponte-a para este servidor. Fica guardado em ~/.progresswatchrc, por isso é uma só vez."
  create_a_space_for_the_agent_to_report_into: "Crie um espaço para o agente reportar."
  point_it_at_this_space_use_local_to_bind_it_to_one_project: "Aponte-a para este espaço. Use --local para o prender a um só projeto."
  install_the_skill_it_knows_75_agents: "Instale a skill. Conhece mais de 75 agentes e pergunta para qual instalar."
  that_is_all_the_agent_decides_on_its_own_when_work_is_worth_tracking: "É tudo — o agente decide sozinho quando vale a pena acompanhar um trabalho, cria uma tarefa para o trabalho e uma subtarefa por passo, e fecha cada uma à medida que termina. Se preferir não correr o instalador de outra pessoa, o mesmo ficheiro é skills/progresswatch-cli/SKILL.md nesse repositório, e vai para .claude/skills/."
  mcp: "MCP"
  connect_an_agent_over_mcp: "Ligar um agente por MCP"
  connect_an_ai_agent_to_progress_watch_over_mcp: "Ligue um agente de IA ao Progress Watch por MCP."
  add_the_server: "Adicione o servidor."
  or_write_it_into_mcp_json_yourself: "Ou escreva-o você mesmo no .mcp.json."
  the_space_uuid_sits_in_the_url_so_any_client_that_takes_only_a_url_works: "O uuid do espaço fica no URL, por isso serve qualquer cliente que só aceite um URL. Para o manter fora do caminho, envie-o antes como cabeçalho."
  four_tools_create_space_create_task_update_task_complete_task: "Quatro ferramentas: create_space, create_task, update_task, complete_task. O agente decide sozinho quando criar uma tarefa e com que frequência reportar. Um que se ligue sem espaço pode chamar create_space e devolver-lhe o URL, por isso nunca fica sem sítio para reportar."
  curl: "curl"
  try_the_api_with_curl: "Experimentar a API com curl"
  try_the_api_with_curl_and_report_from_a_client_that_can_only_fire_a_url: "Experimente a API do Progress Watch com curl, e reporte a partir de um cliente que só consegue disparar um URL."
  create_a_space_keep_its_uuid_whoever_has_it_can_read_and_write_here: "Crie um espaço, guarde o uuid. Quem o tiver pode ler e escrever aqui."
  create_a_task_keep_its_uuid: "Crie uma tarefa, guarde o uuid."
  report_progress_every_write_replaces_the_whole_state: "Reporte progresso. Cada escrita substitui o estado inteiro — envie tudo de cada vez."
  finish_it_this_is_what_sends_the_notification: "Termine-a. É isto que envia a notificação."
  that_is_the_whole_surface_and_it_is_what_the_cli_and_the_mcp_tools_call: "Essa é toda a superfície, e é o que a CLI e as ferramentas MCP chamam. Para algo que corre todos os dias a CLI é uma linha em vez de quatro; para construir sobre isso, a referência da API e o OpenAPI 3.1 estão em /openapi.json."
  one_more_for_a_client_that_cannot_do_the_above: "Mais um, para um cliente que não consegue fazer o acima. A algumas coisas só se pode dar um URL — um pinger de disponibilidade, um campo de webhook no produto de outra pessoa, um router ou um sensor, uma linha de cron com um curl nu. Não podem escolher um método nem enviar corpo, por isso a mesma escrita está acessível como um GET simples."
  the_g_is_for_curl_not_for_us: "O -g é para o curl, não para nós: o curl lê os parênteses retos num URL como um intervalo e recusa o endereço sem ele. Tudo o que se limite a disparar um URL não precisa de nada de especial."
  use_it_only_when_there_is_no_alternative_it_is_a_get_that_writes: "Use-o só quando não houver alternativa. É um GET que escreve, por isso tudo o que siga o URL executa a escrita: cole-o num chat e a pré-visualização da ligação reporta por si. Se o seu cliente conseguir enviar um corpo de pedido, o PUT acima é o que deve usar."
  docker: "Docker"
  self_host_progress_watch_with_docker: "Alojar o Progress Watch com Docker"
  the_docker_compose_file_for_running_your_own_server: "O ficheiro Docker Compose para correr o seu próprio servidor Progress Watch."
  your_own_server_on_your_own_box: "O seu próprio servidor, na sua própria máquina. Nada disto fala com o progress.watch."
  save_this_as_docker_compose_yml_it_runs_the_published_image: "Guarde isto como docker-compose.yml. Corre a imagem publicada, por isso não há nada para clonar nem nada para compilar — e daqui em diante é seu para editar."
  generate_a_secret_and_paste_it_over_the_placeholder: "Gere um segredo e cole-o por cima do exemplo."
  start_it_the_app_a_redis_and_a_sqlite_file: "Arranque-o. A aplicação, um Redis e um ficheiro SQLite num volume."
  then_point_the_cli_at_it_this_page_is_served_from_server: "Depois aponte a CLI para lá. Esta página é servida a partir de {{server}}."
  that_is_a_working_server_notifications_postgres_and_the_one_click_deploy: "Isso é um servidor a funcionar. As notificações, o Postgres, a única coisa que merece um cron e o deploy de um clique estão todos em Alojamento próprio, na barra lateral."
  an_introduction_to_progress_watch_an_open_source_progress_tracker: "Uma introdução ao Progress Watch, um seguidor de progresso de código aberto para tudo o que corre sem si."
  watch_any_process: "Vigie qualquer processo"
  some_things_run_for_hours_with_nobody_watching: "Algumas coisas correm durante horas sem ninguém a olhar: uma recolha noturna, um treino, uma migração, um pipeline de CI, um agente a abrir caminho por uma tarefa longa. O Progress Watch dá-lhes um sítio para reportar, e dá-lhe a si um sítio para olhar — mais uma notificação quando terminam."
  three_commands_from_inside_the_work: "Três comandos a partir de dentro do trabalho"
  create_a_task_where_the_job_starts_report_against_it_as_it_moves: "Crie uma tarefa onde o trabalho começa, reporte contra ela à medida que avança, feche-a quando estiver feito. O do meio é a chamada que vai no seu ciclo, e é a única coisa que conhece os números."
  counts_not_percentages_the_screen_shows_html: "Contagens, não percentagens: o ecrã mostra %{counts}, que lhe diz algo que %{percent} não diz. O total pode mudar à medida que um trabalho descobre mais que fazer — envie o número novo e a barra recalcula. A página %{cli} tem os três, prontos a colar."
  when_the_process_is_not_yours_to_change_html: "Quando o processo não é seu para alterar, %{run} envolve-o por inteiro — cria a tarefa, deixa passar a saída intacta e fecha-a com o código de saída, por isso um trabalho que falha também o avisa. Reporta início e fim em vez de contagens, porque nada fora de um processo sabe quanto já vai."
  or_one_request_from_anything: "Ou um pedido, a partir de qualquer coisa"
  underneath_all_of_it_is_a_single_http_request_html: "Por baixo de tudo isto está um único pedido HTTP, e essa é toda a API. Não há SDK para instalar nem nada para importar, porque embrulhar um %{put} não acrescentaria nada que não conseguisse escrever sozinho em menos tempo do que leva a ler a documentação."
  api_reference: "referência da API"
  the_api_reference_is_the_reference_to_build_against_html: "A %{api} é a referência sobre a qual construir, e colar os exemplos de %{curl} é a forma mais rápida de ver a coisa a funcionar antes de se comprometer."
  agents_report_their_own_work: "Os agentes reportam o seu próprio trabalho"
  agent_skill_lowercase: "skill de agente"
  an_ai_agent_breaks_a_job_into_steps_html: "Um agente de IA parte um trabalho em passos e depois trabalha muito tempo sem nada para mostrar. Ligue um por %{mcp} e ele ganha ferramentas para criar uma tarefa e reportar contra ela: uma tarefa para o trabalho, uma subtarefa por passo, atualizadas pelo caminho. O MCP não precisa de instalar nada em lado nenhum; para um cliente que não o fale, uma %{skill} ensina o mesmo através da CLI."
  the_agent_decides_when_tracking_is_worth_it_and_how_often_to_report: "O agente decide quando vale a pena acompanhar e com que frequência reportar. As descrições das ferramentas dizem-lhe para que serve uma tarefa, não um horário a cumprir."
  no_accounts: "Sem contas"
  a_space_is_a_container_for_tasks_and_its_uuid_is_the_credential: "Um espaço é um contentor de tarefas, e o seu UUID é a credencial. Quem tiver a ligação pode ler e escrever; partilhar é dar a ligação a alguém. Não há nada para registar, nada onde entrar e nenhuma palavra-passe para perder — o que também significa que a ligação é a única forma de voltar a um espaço, por isso vale a pena guardá-la como um token de API."
  progress_is_not_stored: "O progresso não é guardado"
  current_state_lives_in_memory_and_expires_on_its_own: "O estado atual vive em memória e expira sozinho. Um recolhedor que reporta a cada segundo durante três meses não faz crescer nenhuma base de dados, e depois não há nada para limpar. A troca é deliberada: não há histórico nem gráficos, apenas o que está a acontecer agora."
  what_it_will_not_do: "O que não vai fazer"
  send_commands_back: "Devolver comandos."
  it_is_a_departures_board_not_an_orchestrator: "É um painel de partidas, não um orquestrador. Um processo reporta; nada lhe reporta a ele."
  keep_a_log: "Guardar um registo."
  one_line_the_latest_per_task: "Uma linha, a última, por tarefa. Guardar registos é um problema resolvido e não é isto."
  nest_more_than_one_level: "Aninhar mais do que um nível."
  a_task_may_have_steps_a_step_may_not: "Uma tarefa pode ter passos; um passo não."
  run_it_yourself: "Corra-o você mesmo"
  the_docker_snippet: "o excerto de Docker"
  self_hosting_lowercase: "alojamento próprio"
  the_server_is_open_source_and_self_hosting_is_one_container_html: "O servidor é de código aberto e alojá-lo é um contentor mais um Redis — veja %{docker} para o arrancar e %{self_hosting} para o correr como deve ser. O serviço alojado existe para que não tenha de o fazer, não porque o software fique coxo sem ele."
  nothing_to_sign_up_for: "Nada para registar"
  make_a_space_keep_its_link_and_start_reporting_into_it: "Crie um espaço, guarde a ligação, e comece a reportar para lá a partir de qualquer coisa."
  create_a_space: "Criar um espaço"
  watch_any_script_crawler_ci_job_or_agent: "Vigie qualquer script, recolhedor, trabalho de CI ou agente. Reporta o progresso com um único pedido HTTP; vê-o de onde estiver e recebe uma notificação quando termina. Código aberto, com alojamento próprio."
  the_server_is_open_source_under_the_agpl: "O servidor é de código aberto sob a AGPL, e o serviço alojado corre a mesma imagem que você correria. Alojá-lo por conta própria custa um contentor e um Redis, e a base de dados fica pequena para sempre porque o progresso nunca lá é escrito."
  one_file: "Um único ficheiro"
  the_docker_page: "a página do Docker"
  docker_compose_yml_is_the_whole_install_html: "%{file} é toda a instalação. Corre a imagem publicada, por isso não há nada para clonar nem nada para compilar — copie-o da %{docker}, que imprime o ficheiro atual, substitua o segredo de exemplo por %{generate} e arranque:"
  that_is_the_whole_setup_the_app_on_localhost_html: "Isso é toda a configuração: a aplicação em %{url}, um Redis e um ficheiro SQLite num volume com nome. Abra-a, crie um espaço, e o menu Ligar desse espaço dá-lhe comandos com o UUID já preenchido."
  configuring_it: "Configurar"
  the_file_is_yours_from_the_moment_you_save_it_html: "O ficheiro é seu a partir do momento em que o guarda, e é o único sítio onde algo é configurado — cada definição é uma linha num bloco %{environment}, portanto acrescentar uma é acrescentar uma linha:"
  environment_variables_is_the_full_list_html: "%{link} é a lista completa, e tudo o que lá está funciona aqui. Para publicar num porto diferente do 7979, mude o lado esquerdo de %{ports} — a aplicação dentro do contentor está sempre no 3000."
  what_is_running: "O que está a correr"
  two_processes_and_a_file_the_app_answers_requests: "Dois processos e um ficheiro. A aplicação responde aos pedidos e corre o worker dentro de si — o Sidekiq está embutido no Puma, por isso a uma notificação não pode faltar um serviço próprio. O Redis guarda o progresso atual de cada tarefa e a fila de jobs; o SQLite guarda os espaços e a forma de cada tarefa."
  updating_it: "Atualizá-lo"
  name_the_service_a_bare_pull_takes_redis_with_it_html: "Indique o serviço. Um %{pull} isolado também descarrega o Redis, e se tiver sido publicado um %{redis} mais recente, o %{up} substitui também esse contentor — deitando fora o progresso de tudo o que está a correr."
  replacing_only_the_app_container_leaves_every_running_task_where_it_was_html: "Substituir apenas o contentor da aplicação deixa cada tarefa em curso exatamente onde estava, porque o progresso está no Redis e o Redis não foi tocado. Títulos e estrutura estão no volume e sobrevivem de qualquer forma. Nada sobrevive a %{down} nem a um reinício do host: o Redis não guarda nada em disco, de propósito."
  why_7979: "Porquê 7979"
  not_3000_this_is_a_service_you_leave_running_for_weeks_html: "Não 3000. Este é um serviço que deixa a correr durante semanas enquanto trabalha, e o 3000 é onde aterram os seus próprios servidores de desenvolvimento — Rails, Vite, Next, Grafana e metade das linhas %{run} de outros guias. Um serviço em segundo plano não devia ocupar o porto mais disputado da máquina, muito menos um cujo URL cola num segredo de CI e depois esquece."
  inside_the_container_it_is_still_3000_html: "Dentro do contentor continua a ser o 3000; só o porto publicado mudou, e isso é a linha %{ports}."
  losing_the_volume_is_recoverable: "Perder o volume é recuperável"
  spaces_and_task_structure_are_on_it_and_nothing_else: "Estão lá os espaços e a estrutura das tarefas, e mais nada. Se desaparecer, cria um espaço novo e os seus processos repovoam tudo no pedido seguinte. Faça cópia de segurança se preferir não redistribuir um UUID de espaço novo a tudo o que lá reporta — mas não há lá nada que não possa ser reconstruído voltando a correr os trabalhos."
  sqlite_or_postgresql: "SQLite ou PostgreSQL"
  both_from_the_same_image_and_the_same_migrations_html: "Ambos, a partir da mesma imagem e das mesmas migrações, escolhidos por %{database_url}. O SQLite é o predefinido e é a resposta certa para uma máquina: duas tabelas, leituras por chave primária, quase nunca escritas. Aponte para %{postgres} quando correr vários contentores da aplicação, porque não podem partilhar um ficheiro."
  behind_a_proxy: "Atrás de um proxy"
  set_force_ssl_true_once_something_in_front_terminates_tls_html: "Ponha %{force_ssl} assim que algo à frente da aplicação terminar o TLS. Está desligado por omissão para que uma instalação alcançada por HTTP simples não o reencaminhe para um certificado que não tem."
  notifications_lowercase: "notificações"
  set_a_vapid_key_pair_and_a_notify_me_button_appears_html: "Ponha um par de chaves VAPID e aparece um botão «%{notify}» em cada espaço; deixe as chaves por definir e a funcionalidade não existe. Não há nada para registar na Apple nem na Google. Veja %{link} para a história completa, incluindo o que tem de acontecer num telemóvel."
  sweeping_empty_spaces: "Varrer os espaços vazios"
  ever: "alguma vez"
  opening_the_site_creates_a_space_for_you_html: "Abrir o site cria um espaço para si, por isso criam-se muitos que nunca são usados — incluindo por tudo o que percorre a página. Um espaço que %{ever} tenha tido uma tarefa é guardado para sempre, por muito tempo que ninguém olhe para ele. Só são varridos os que nunca tiveram uma única tarefa, e apenas quando têm mais de 30 dias."
  nothing_runs_it_for_you_schedule_it_however_you_already_schedule_things: "Nada o corre por si. Agende-o como já agenda as coisas:"
  crontab_daily_at_0417: "crontab, diariamente às 04:17"
  because_nothing_is_on_a_timer_30_days_is_a_floor: "Como nada corre em temporizador, 30 dias são um mínimo e não um calendário: corra-o diariamente e os espaços vazios saem no dia em que se qualificam, corra-o uma vez por ano e ficam até lá. Saltá-lo é seguro para os seus dados — a varredura só leva linhas que nunca foram usadas — significa apenas que a tabela cresce com espaços que ninguém abriu."
  your_instance_is_not_indexable: "A sua instância não é indexável"
  every_page_of_a_self_hosted_install_is_noindex_html: "Todas as páginas de uma instalação própria são %{noindex}, o %{robots} proíbe tudo, e %{sitemap} responde 404. A partir da máquina de alguém não há público a alcançar nem nada ali que queira ser encontrado numa pesquisa, e não é preciso configurar nada para isso — é o que se recebe."
  the_point_of_the_whole_product_is_the_moment_a_job_finishes: "O sentido de todo o produto é o momento em que um trabalho termina enquanto está noutro sítio. O Progress Watch entrega isso por Web Push, direto do servidor para o seu navegador — computador e telemóvel pelo mesmo mecanismo, sem nada pelo meio que seja nosso."
  turning_it_on: "Ligar"
  push_is_opt_in_per_space_open_a_space_press_html: "O push é opcional e por espaço. Abra um espaço, carregue em %{notify}, e esse navegador fica registado para esse espaço e para mais nenhum. Nada sobre si é guardado até carregar, e remover o espaço volta a cancelar o registo."
  on_a_phone_install_the_site_first: "Num telemóvel, instale primeiro o site"
  add_to_home_screen: "Adicionar ao ecrã principal"
  ios_delivers_web_push_only_to_a_site_added_to_the_home_screen_html: "O iOS entrega Web Push apenas a um site adicionado ao ecrã principal, e não há forma de contornar: abra o espaço no Safari, Partilhar, %{add}, e carregue em Avisar-me a partir daí. O Android e o computador funcionam a partir de um separador normal."
  installing_has_a_second_benefit_on_ios: "Instalar tem uma segunda vantagem no iOS. O Safari limpa o armazenamento local de um site normal ao fim de sete dias sem visitas, e uma aplicação web instalada está isenta — e é nesse armazenamento que vive a sua lista de espaços. Não há conta nenhuma a partir da qual a repor."
  a_tree_of_steps_is_one_notification: "Uma árvore de passos é uma notificação"
  every_task_that_finishes_notifies_including_each_step_of_a_job: "Todas as tarefas que terminam avisam, incluindo cada passo de um trabalho. Não se acumulam: um passo substitui no lugar a notificação anterior do seu trabalho em vez de se somar a ela, por isso um deploy de dez passos lê-se como uma linha que vai mudando, e só a conclusão do próprio trabalho volta a vibrar."
  what_each_party_learns: "O que cada parte fica a saber"
  payloads_are_encrypted_for_the_browser_that_subscribed: "As cargas vão cifradas para o navegador que subscreveu, com chaves que só ele tem. A Google, a Mozilla e a Apple encaminham texto cifrado e não conseguem ler os títulos das suas tarefas. O que ficam a saber é que um determinado navegador recebeu alguma coisa, e quando."
  your_own_server_learns_one_thing_it_otherwise_would_not: "O seu próprio servidor fica a saber uma coisa que de outro modo não saberia: que um navegador subscreveu num dado espaço. É essa a razão de ser um botão por espaço e não uma definição global — a lista de espaços que um navegador guarda vive nesse navegador e em mais lado nenhum, e uma subscrição é a única coisa que põe um espaço nos registos do servidor."
  if_you_are_self_hosting_push_content_minimal_html: "Se aloja por conta própria, %{minimal} envia «Task completed» sem título. A carga vai cifrada de qualquer forma; isto é para o ecrã bloqueado de um telemóvel que outra pessoa pode ver."
  self_hosting_it_has_to_be_https: "Alojamento próprio: tem de ser HTTPS"
  a_browser_hands_out_a_service_worker_only_on_a_secure_origin_html: "Um navegador só entrega um service worker numa origem segura, e o Web Push precisa de uma. Em %{address} o botão nem sequer aparece, digam o que disserem as suas chaves — e nada explica porquê, porque no que toca à página a funcionalidade não existe nesse navegador. %{localhost} é a única exceção, e é exatamente por isso que isto funciona enquanto o experimenta e deixa de funcionar assim que o passa para uma máquina na rede."
  so_notifications_mean_a_certificate_html: "Notificações significam portanto um certificado: algo à frente que termine o TLS — Caddy, Traefik, nginx, um túnel da Cloudflare — e %{force_ssl} posto assim que estiver lá."
  self_hosting_generating_the_keys: "Alojamento próprio: gerar as chaves"
  both_keys_unset_means_the_feature_does_not_exist_generate_a_pair_once: "As duas chaves por definir significam que a funcionalidade não existe — sem botão, e nada guardado sobre ninguém. Gere um par uma vez:"
  put_both_into_the_environment_block_and_run_up_again_html: "Ponha ambas no bloco %{environment} em docker-compose.yml e volte a fazer %{up}. Não %{restart}, que reutiliza a configuração que o contentor já tem."
  there_is_nothing_to_register_anywhere_lead: "Não há nada para registar em lado nenhum"
  there_is_nothing_to_register_anywhere_html: "%{nothing} — sem projeto Firebase, sem conta de programador da Apple, sem chave de API. Quem fez o navegador é quem opera o serviço de push; o endereço dele chega dentro da subscrição que o navegador entrega ao seu servidor, e o par VAPID é a prova auto-assinada de que todas as notificações vieram do mesmo remetente. %{subject} é apenas um endereço de contacto e ninguém o verifica."
  do_not_rotate_the_keys_existing_subscriptions_are_bound_to_them: "Não rode as chaves. As subscrições existentes estão presas a elas, os navegadores não são avisados, e simplesmente deixam de receber."
  why_there_is_no_mobile_app: "Porque não há aplicação móvel"
  a_react_native_app_was_designed_for_this_and_has_not_been_built: "Foi desenhada uma aplicação em React Native para isto e não foi construída, porque o Web Push cobre aquilo para que servia. A única coisa que continuaria a fazer melhor é vigiar vários servidores ao mesmo tempo: um navegador está preso a uma origem, por isso um espaço noutro servidor abre-se nesse servidor em vez de se juntar a uma lista única. Se vigia um espaço alojado e outro próprio, instale o site a partir de cada um."
  everything_is_an_environment_variable: "Tudo é uma variável de ambiente. Não há ficheiros de configuração para editar nem credenciais cifradas cozidas na imagem, por isso o mesmo contentor corre num NAS em casa e na nuvem."
  general: "Geral"
  variable: "Variável"
  default: "Predefinição"
  what_it_does: "O que faz"
  the_only_variable_that_is_required_in_production_html: "A única variável obrigatória em produção. Gere uma com %{generate} e guarde-a."
  where_spaces_and_task_structure_live_html: "Onde vivem os espaços e a estrutura das tarefas. O ficheiro predefinido é o que o volume do Docker guarda; aponte para %{postgres} numa instalação na nuvem. O progresso em si nunca é escrito aqui."
  set_true_when_something_in_front_terminates_tls_html: "Ponha %{value} quando algo à frente terminar o TLS. Também comanda o %{assume}, por isso deixá-lo desligado mantém a aplicação utilizável por HTTP simples em vez de reencaminhar para um certificado que não tem."
  the_port_puma_binds_inside_the_container_html: "O porto a que o Puma se liga dentro do contentor. O %{compose} publica-o no 7979, porque um serviço que se deixa a correr durante semanas não devia ocupar o porto que os seus servidores de desenvolvimento querem."
  logs_go_to_stdout_and_nowhere_else_this_is_how_much_of_them: "Os registos vão para stdout e mais lado nenhum. Isto é quantos."
  how_many_spaces_and_tasks_one_address_may_create_per_hour: "Quantos espaços e tarefas um endereço pode criar por hora. Por definir significa sem limite, que é a resposta certa para um servidor a que só você chega. Reportar progresso nunca é limitado."
  behind_a_proxy_the_limit_is_only_as_good_as_the_address_html: "Atrás de um proxy, %{limit} vale tanto quanto o endereço que a aplicação vê. O Rails lê o %{forwarded} e confia nele vindo de gamas privadas, que é o que um proxy inverso no mesmo anfitrião envia — mas se o cabeçalho não chegar, cada pedido parece um só cliente e o limite tranca toda a gente de uma vez em vez de ninguém."
  redis_holds_two_unrelated_things: "O Redis guarda duas coisas sem relação: o progresso atual de cada tarefa, e a fila do Sidekiq. Por omissão são duas bases de dados lógicas de um servidor, e qualquer uma pode passar para a sua própria instância."
  the_server_used_for_both_roles_split_into_db_0_and_db_1: "O servidor usado para ambos os papéis, dividido em db 0 para o progresso e db 1 para a fila."
  overrides_the_progress_store_alone: "Substitui apenas o armazenamento do progresso."
  overrides_the_queue_alone: "Substitui apenas a fila."
  how_long_a_task_keeps_its_progress_without_being_written_to: "Quanto tempo uma tarefa mantém o seu progresso sem ser escrita. Cada relatório renova-o, por isso isto é na verdade quanto tempo uma tarefa abandonada fica no ecrã."
  key_prefix_for_the_progress_store: "Prefixo das chaves do armazenamento do progresso, para poder partilhar uma base de dados com outra coisa."
  both_keys_unset_means_the_feature_does_not_exist_no_button_on_a_space: "As duas chaves por definir significam que a funcionalidade não existe: sem botão num espaço, e nada guardado sobre ninguém. Não há nada para registar na Apple nem na Google — quem fez o navegador é quem opera o serviço de push. Gere um par uma vez e não o rode; as subscrições existentes estão presas a ele e os navegadores não são avisados."
  public_half_of_the_pair_that_signs_every_push: "A metade pública do par que assina cada push. Entregue ao navegador quando este subscreve."
  private_half_never_leaves_the_server: "A metade privada. Nunca sai do servidor."
  a_contact_address_the_push_services_can_reach: "Um endereço de contacto a que os serviços de push podem chegar se algo correr mal. Ninguém o verifica."
  full_puts_the_task_title_in_the_notification_html: "%{full} põe o título da tarefa na notificação, %{minimal} envia «Task completed» e nada identificável."
  process_sizing: "Dimensionar os processos"
  puma_threads_per_process_and_the_size_of_both_pools: "Threads do Puma por processo, e o tamanho tanto do conjunto de ligações à base de dados como ao Redis."
  puma_worker_processes_zero_runs_a_single_process: "Processos worker do Puma. Zero corre um único processo, que é a resposta certa numa máquina pequena."
  threads_in_the_sidekiq_process: "Threads no processo do Sidekiq. Enviar notificações é o único trabalho que existe."
  sidekiq_runs_inside_puma_set_false_to_run_it_as_its_own_process: "O Sidekiq corre dentro do Puma. Defina `false` onde corre um processo worker dedicado."
